<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12121a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rewind">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Rewind Jobs</title>
<style>
  :root {
    --bg: #12121a; --panel: #1a1a26; --panel2: #222232; --line: #2c2c40;
    --text: #f2f2f6; --sub: #a0a0b4; --dim: #6c6c82;
    --accent: #d8a86a; --green: #4fb37f; --blue: #6aa4e0; --red: #e06a6a; --amber: #e8a83a;
    --radius: 12px; color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f3f2ee; --panel: #ffffff; --panel2: #f0efea; --line: #dddcd4;
    --text: #1b1b22; --sub: #5d5d6b; --dim: #9a9aa6;
    --accent: #a8742e; --green: #23875a; --blue: #2f6db0; --red: #c03f3f; --amber: #b0761a; color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text);
         display: flex; flex-direction: column; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: var(--blue); }
  .hidden { display: none !important; }

  /* Top bar */
  header { display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
           background: var(--panel); border-bottom: 1px solid var(--line); flex-shrink: 0; }
  header .brand { font-weight: 800; letter-spacing: .02em; }
  header .who { font-size: 12px; color: var(--sub); }
  header .grow { flex: 1; min-width: 0; }
  header { flex-wrap: wrap; }
  header select { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13px;
                  order: 10; flex: 1 1 100%; }
  .icon-btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 14px; line-height: 1; }
  #stamp { font-size: 11px; color: var(--dim); padding: 4px 16px; background: var(--bg); flex-shrink: 0; }
  #stamp.offline { color: var(--amber); }

  /* Views */
  main { flex: 1; min-height: 0; position: relative; }
  .view { position: absolute; inset: 0; overflow-y: auto; padding: 8px 12px 16px; }
  #view-map { padding: 0; overflow: hidden; }
  #map { width: 100%; height: 100%; background: var(--panel2); }
  @media (min-width: 900px) {
    main.split #view-jobs, main.split #view-today { right: 50%; }
    main.split #view-map { left: 50%; display: block !important; border-left: 1px solid var(--line); }
  }

  /* Bottom tabs */
  nav { display: flex; background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); flex-shrink: 0; }
  nav button { flex: 1; background: none; border: none; padding: 9px 4px 8px; font-size: 11px; color: var(--sub); display: flex; flex-direction: column; align-items: center; gap: 2px; }
  nav button b { font-size: 19px; line-height: 1; font-weight: 400; }
  nav button.on { color: var(--accent); }
  #bell-badge .badge { position: absolute; top: -6px; right: -6px; margin: 0; }
  .notif { cursor: pointer; }
  .notif.unread { border-left: 3px solid var(--accent); }
  .notif .t { font-weight: 700; font-size: 14px; }
  .notif:not(.unread) .t { font-weight: 500; color: var(--sub); }
  nav .badge { background: var(--red); color: #fff; border-radius: 9px; font-size: 10px; padding: 0 5px; margin-left: 3px; }

  /* Lists */
  .group { font-size: 12px; font-weight: 700; color: var(--dim); text-transform: uppercase; letter-spacing: .07em; margin: 14px 4px 6px; }
  .group:first-child { margin-top: 6px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; }
  .job { cursor: pointer; }
  .job:active { background: var(--panel2); }
  .row { display: flex; align-items: center; gap: 8px; }
  .between { justify-content: space-between; }
  .co { font-weight: 700; }
  .meta { font-size: 13px; color: var(--sub); }
  .small { font-size: 12px; color: var(--dim); }
  .chip { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--panel2); color: var(--sub); white-space: nowrap; }
  .chip.green { color: var(--green); } .chip.amber { color: var(--amber); } .chip.red { color: var(--red); } .chip.blue { color: var(--blue); }
  .empty { text-align: center; color: var(--dim); padding: 40px 16px; }
  .search { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; margin: 4px 0 6px; }

  /* Sheets (details, closure) */
  .sheet { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; }
  .sheet-head { display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .sheet-head .t { flex: 1; font-weight: 800; }
  .sheet-body { flex: 1; overflow-y: auto; padding: 12px 12px calc(24px + env(safe-area-inset-bottom)); }
  .sec { margin-top: 14px; }
  .sec h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--dim); margin: 0 4px 6px; }
  .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .act { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 6px; text-align: center; font-size: 13px; font-weight: 600; text-decoration: none; color: var(--text); }
  .act:active { background: var(--panel2); }
  .act.primary { background: var(--accent); color: #1b1408; border-color: var(--accent); }
  .act.on { border-color: var(--accent); color: var(--accent); }
  .sheet-foot { display: grid; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid var(--line); }
  .note-row { display: flex; gap: 8px; align-items: flex-end; margin-top: 6px; }
  .note-row textarea#note-text { flex: 1; min-height: 42px; height: 42px; resize: none; overflow: hidden; padding-top: 10px; padding-bottom: 10px; }
  .note-row .act { padding: 11px 16px; }
  .loc { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); margin-bottom: 10px; overflow: hidden; }
  .loc-head { padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel2); }
  .loc-head .co { font-size: 15px; }
  .loc-part { padding: 10px 14px; border-top: 1px solid var(--line); }
  .loc-part:first-of-type { border-top: none; }
  #menu-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
  #menu { background: var(--panel); border-radius: 16px 16px 0 0; width: 100%; max-width: 560px; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); }
  #menu .mt { font-size: 13px; color: var(--sub); margin: 0 4px 10px; }
  #menu .actions { grid-template-columns: 1fr 1fr; }
  #menu .act { padding: 14px 8px; font-size: 15px; }
  .act .sub { display: block; font-size: 11px; font-weight: 500; color: var(--sub); margin-top: 2px; }
  .partbox { border: 2px solid var(--accent); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 8px; background: var(--panel); }
  .partbox .lbl { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
  .partbox .trk { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 15px; color: var(--sub); margin-top: 2px; }
  .partbox .trk b { font-size: 26px; color: var(--accent); letter-spacing: .04em; }
  .partbox .pn { font-size: 15px; font-weight: 600; margin-top: 2px; word-break: break-word; }
  .egg { display: inline-block; margin-left: 4px; font-size: .8em; animation: egg 1.6s ease-in-out infinite; cursor: default; }
  @keyframes egg { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-14deg) scale(1.15); } 40% { transform: rotate(10deg); } 60% { transform: rotate(0); } }
  .last4 { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 800; color: var(--accent); }
  .act:disabled { opacity: .45; }
  .act.wide { grid-column: span 3; padding: 13px; font-size: 15px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 13px; }
  .kv dt { color: var(--dim); } .kv dd { word-break: break-word; }
  .pre { white-space: pre-wrap; font-size: 13px; }
  .feed .item { border-left: 2px solid var(--line); padding: 2px 0 8px 10px; }
  .feed .item .h { font-size: 12px; color: var(--dim); }
  .feed .item.hem { border-left-color: var(--amber); }

  /* Forms */
  label.f { display: block; margin-bottom: 12px; }
  label.f span { display: block; font-size: 13px; color: var(--sub); margin-bottom: 4px; }
  label.f span i { color: var(--red); font-style: normal; }
  input.in, select.in, textarea.in { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; }
  textarea.in { min-height: 90px; resize: vertical; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 8px 12px; font-size: 14px; }
  .seg button.on { border-color: var(--accent); color: var(--accent); font-weight: 700; }

  /* Login */
  #login { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 24px; }
  #login .box { width: 100%; max-width: 320px; text-align: center; }
  #login h1 { font-size: 22px; margin-bottom: 4px; }
  #login p { color: var(--sub); font-size: 14px; margin-bottom: 20px; }
  #code { width: 100%; text-align: center; font-size: 26px; letter-spacing: .35em; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  #login .err { color: var(--red); min-height: 20px; margin-top: 10px; font-size: 14px; }

  /* Toast */
  #toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 200;
           background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: 90vw; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s .8s linear infinite; vertical-align: -2px; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h1>Rewind Repair</h1>
    <p>Enter your 6-digit code</p>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="••••••">
    <button class="act primary wide" style="width:100%;margin-top:12px" onclick="login()">Sign in</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<header>
  <div class="grow">
    <div class="brand">Rewind Jobs</div>
    <div class="who" id="who"></div>
  </div>
  <select id="tech-pick" class="hidden" onchange="pickTech(this.value)"></select>
  <button class="icon-btn" onclick="openNotifs()" title="Notifications" style="position:relative">🔔<span id="bell-badge"></span></button>
  <button class="icon-btn" onclick="refresh(true)" title="Refresh">↻</button>
  <button class="icon-btn" onclick="toggleTheme()" title="Light / dark" id="theme-btn">◐</button>
  <button class="icon-btn" onclick="if(confirm('Sign out?'))logout()" title="Sign out" style="font-size:12px">Sign out</button>
</header>
<div id="stamp"></div>

<main id="main" class="split">
  <section class="view" id="view-today"></section>
  <section class="view hidden" id="view-jobs"></section>
  <section class="view hidden" id="view-map"><div id="map"></div></section>
  <section class="view hidden" id="view-parts"></section>
  <section class="view hidden" id="view-pay"></section>
  <section class="view hidden" id="view-admin"></section>
</main>

<nav>
  <button data-v="today" class="on" onclick="show('today')"><b>◷</b>Today</button>
  <button data-v="jobs" onclick="show('jobs')"><b>☰</b>Jobs</button>
  <button data-v="map" onclick="show('map')"><b>⌖</b>Map</button>
  <button data-v="parts" onclick="show('parts')"><b>▣</b><span>Parts<span id="parts-badge"></span></span></button>
  <button data-v="pay" id="nav-pay" class="hidden" onclick="show('pay')"><b>$</b>Pay</button>
  <button data-v="admin" id="nav-admin" class="hidden" onclick="show('admin')"><b>▤</b>Admin</button>
</nav>

<div id="toast"></div>

<script>
// ── Config ────────────────────────────────────────────────────────────────
// Nord Claude's relay (Apps Script web app). Codes are checked there, never in this page.
const API = 'https://script.google.com/macros/s/AKfycbwBvMfaJCj-UDoE-Oa9jEcIYxy4XIT2v9hFHJ-kqkEHOs8afDBxL9KZiufacb1gVsATlQ/exec';
const MAPS_KEY = 'AIzaSyBvtDmQkxaYjYffIyJYYH7I0waSvuKF3Eg';
const AUTO_REFRESH_MIN = 5;
const APP_VERSION = '3.35';
const VAPID_PUBLIC = 'BP2C2HFEMyUFpKCzr7F5zXXF8RI12OnaS-eZohOoQmsoIXI3K9mclMpeti1Ey6-SpcI04Lp-SSR6rOHt0be9Q3E';   // phone notifications (the private half lives in the rewind-push worker)

// ── Small helpers ─────────────────────────────────────────────────────────
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
function toast(msg, ms) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), ms || 2600);
}
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const nice = iso => new Date(iso + 'T12:00').toLocaleDateString([], { weekday: 'short', month: 'numeric', day: 'numeric' });
// Phone numbers: "+1…", "(303) …", "303-555-…" anywhere; a bare 10-digit run only after a phone label
// (CNE / WO numbers are 10 digits too)
function phonesIn(text) {
  const t = String(text || ''), out = [];
  const re = /(\+?1[\s.-]?)?(\(?\d{3}\)?)([\s.-]?)(\d{3})([\s.-]?)(\d{4})(?!\d)/g;
  let m;
  while ((m = re.exec(t))) {
    if (m.index > 0 && /\d/.test(t[m.index - 1])) continue;
    const formatted = (m[1] && m[1].includes('+')) || /[()]/.test(m[2]) || m[3] || m[5];
    const labelled = /(phone|tel|mobile|cell|contact|call|ph|☎|📞)[^\n\d]{0,20}$/i.test(t.slice(Math.max(0, m.index - 30), m.index));
    if (!formatted && !labelled) continue;
    const d = m[0].replace(/\D/g, '').replace(/^1(?=\d{10}$)/, '');
    if (d.length === 10 && !out.includes(d)) out.push(d);
  }
  return out.map(d => '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6));
}
const shortDate = s => { const t = Date.parse(s); return isNaN(t) ? '' : new Date(t).toLocaleDateString([], { month: 'numeric', day: 'numeric' }); };
const navUrl = j => j.lat ? 'https://www.google.com/maps/dir/?api=1&destination=' + j.lat + ',' + j.lng
                          : 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(j.address || j.loc || j.city);

// ── API ───────────────────────────────────────────────────────────────────
let session = store.get('rw_session', null);   // { pin, user, techs }
async function api(op, extra) {
  let res, j;
  try {
    res = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ action: 'app', op, pin: session && session.pin }, extra || {})) });
    j = await res.json();
  } catch (e) { throw Object.assign(new Error(navigator.onLine ? 'Could not reach the server' : 'No signal'), { offline: true }); }
  if (j.auth) { logout(); throw new Error(j.error || 'Signed out'); }
  if (!j.ok) throw new Error(j.error || 'Something went wrong');
  return j;
}

// ── Login ─────────────────────────────────────────────────────────────────
async function login() {
  const pin = $('#code').value.trim();
  if (!pin) return;
  $('#login-err').innerHTML = '<span class="spin"></span>';
  session = { pin };
  try {
    const j = await api('login');
    session = { pin, user: j.user, techs: j.techs || [] };
    store.set('rw_session', session);
    start();
  } catch (e) { session = null; $('#login-err').textContent = e.message; }
}
function logout() {
  store.del('rw_session'); session = null;
  $('#login').classList.remove('hidden'); $('#code').value = '';
}
$('#code').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

// ── State ─────────────────────────────────────────────────────────────────
let jobs = [], parts = null, view = 'today', techFilter = 'ALL', search = '';
let lastAt = null, offline = false;

function start() {
  $('#login').classList.add('hidden');
  const u = session.user;
  $('#who').textContent = u.name + (u.admin ? ' · admin' : '');
  const sel = $('#tech-pick');
  if (u.admin) {
    techFilter = store.get('rw_tech', 'ALL');
    sel.innerHTML = '<option value="ALL">All techs</option>' + session.techs.map(t =>
      '<option value="' + esc(t.tech) + '">' + esc(t.name) + (t.area ? ' · ' + esc(t.area) : '') + '</option>').join('');
    sel.value = techFilter; sel.classList.remove('hidden');
  } else sel.classList.add('hidden');
  $('#nav-pay').classList.toggle('hidden', !!u.admin);
  $('#nav-admin').classList.toggle('hidden', !u.admin);
  flushQueue();
  const cached = store.get('rw_jobs_' + u.name + '_' + techFilter, null);
  if (cached) { jobs = cached.jobs; lastAt = cached.at; render(); }
  refresh();
  openFromLink();
  if (pushSupported() && Notification.permission === 'granted') enablePush(true);   // keep the subscription fresh
  clearInterval(start.t); start.t = setInterval(() => { if (!document.hidden) refresh(); }, AUTO_REFRESH_MIN * 60e3);
}
function pickTech(t) { techFilter = t; store.set('rw_tech', t); parts = null; refresh(true); if (view === 'admin' && adminTab === 'pay') renderPay(); }

async function refresh(loud) {
  if (!session) return;
  stamp('<span class="spin"></span> Updating…');
  if (view === 'parts' || parts === null || loud) loadParts();       // in parallel with the job list
  try {
    const j = await api('jobs', { tech: techFilter });
    jobs = j.jobs; lastAt = j.at; offline = false;
    flushQueue();
    setUnread(j.unread);
    store.set('rw_jobs_' + session.user.name + '_' + techFilter, { jobs, at: lastAt });
    render();
    if (loud) toast('Up to date');
    setTimeout(prefetchDetails, 1500);
  } catch (e) {
    offline = !navigator.onLine || /fetch|network/i.test(e.message);
    render();
    if (!offline) toast(e.message, 4000);
  }
}
function stamp(html) {
  const s = $('#stamp');
  if (html) { s.innerHTML = html; s.className = ''; return; }
  const when = lastAt ? new Date(lastAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : 'never';
  s.className = offline ? 'offline' : '';
  s.textContent = (offline ? 'Offline — showing jobs from ' : 'Updated ') + when + ' · ' + jobs.length + ' open job' + (jobs.length === 1 ? '' : 's') +
    (queued ? ' · 📴 ' + queued + ' waiting to send' : '') + ' · v' + APP_VERSION;
}

// ── Views ─────────────────────────────────────────────────────────────────
function show(v) {
  view = v;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  ['today', 'jobs', 'map', 'parts', 'pay', 'admin'].forEach(x => $('#view-' + x).classList.toggle('hidden', x !== v));
  $('#main').classList.toggle('split', v === 'today' || v === 'jobs');
  if (v === 'pay') renderPay();
  if (v === 'admin') renderAdmin();
  if (v === 'map' || (window.innerWidth >= 900 && (v === 'today' || v === 'jobs'))) { $('#view-map').classList.remove('hidden'); ensureMap(); }
  if (v === 'parts' && parts === null) loadParts();
}
function render() {
  stamp();
  renderToday(); renderJobs(); renderMap(); renderParts();
}

function apptChip(j) {
  if (!j.appt) return '<span class="chip">Not scheduled</span>';
  const t = todayISO(), d = j.appt.date;
  const cls = d < t ? 'red' : d === t ? 'green' : 'blue';
  return '<span class="chip ' + cls + '">' + (d === t ? 'Today' : d === addDays(t, 1) ? 'Tomorrow' : nice(d)) + (j.appt.time ? ' · ' + esc(j.appt.time) : '') + '</span>';
}
const rposChip = j => j.rpos ? '<span class="chip red" style="background:rgba(224,106,106,.15)">🚨 RPOS · urgent</span> ' : '';
function jobCard(j) {
  const admin = session.user.admin && techFilter === 'ALL';
  return '<div class="card job" onclick="openJob(\'' + j.cni + '\')"' + (j.rpos ? ' style="border-left:4px solid var(--red)"' : '') + '>' +

function renderToday() {
  const el = $('#view-today');
  if (!jobs.length) { el.innerHTML = '<div class="empty">No open jobs 🎉</div>'; return; }
  const t = todayISO(), groups = { urgent: [], over: [], today: [], tomorrow: [], week: [], later: [], none: [] };
  jobs.forEach(j => {
    const d = j.appt && j.appt.date;
    if (j.rpos) groups.urgent.push(j);              // RPOS: always on top, whatever the date
    else if (!d) groups.none.push(j);
    else if (d < t) groups.over.push(j);
    else if (d === t) groups.today.push(j);
    else if (d === addDays(t, 1)) groups.tomorrow.push(j);
    else if (d <= addDays(t, 7)) groups.week.push(j);
    else groups.later.push(j);
  });
  const byDate = (a, b) => (a.appt ? a.appt.date + (a.appt.time || '') : '9') < (b.appt ? b.appt.date + (b.appt.time || '') : '9') ? -1 : 1;
  const sec = (title, list) => list.length ? '<div class="group">' + title + ' · ' + list.length + '</div>' + list.sort(byDate).map(jobCard).join('') : '';
  const rd = routeDay(), rn = rd ? jobs.filter(j => j.appt && j.appt.date === rd && j.lat).length : 0;
  const routeBtn = rn ? '<button class="act" style="width:100%;margin:6px 0 2px" onclick="openRoute()">🧭 Route for ' + (rd === t ? 'today' : nice(rd)) + ' · ' + rn + ' stop' + (rn === 1 ? '' : 's') + '</button>' : '';
  el.innerHTML = routeBtn + sec('🚨 Urgent — RPOS', groups.urgent) + sec('Today', groups.today) + sec('Past date — reschedule or close', groups.over) + sec('Tomorrow', groups.tomorrow) +
                 sec('Next 7 days', groups.week) + sec('Later', groups.later) + sec('Not scheduled yet', groups.none);
}

let map = null, markers = [], mapLoading = false, myDot = null;
const TECH_HUES = ['#6aa4e0', '#4fb37f', '#e8a83a', '#c27ae0', '#e06a6a', '#3ac2c2', '#d8d86a', '#e07ab4', '#8a8ae0', '#a0c25a', '#e0956a', '#5ab4e0', '#b4a07a'];
function ensureMap() {
  if (map || mapLoading) return;
  mapLoading = true;
  window.initMap = () => {
    map = new google.maps.Map($('#map'), { center: { lat: 39.5, lng: -98.35 }, zoom: 4, streetViewControl: false, mapTypeControl: false,
      fullscreenControl: false, clickableIcons: false, styles: document.documentElement.dataset.theme === 'light' ? [] : DARK });
    renderMap();
    if (navigator.geolocation) navigator.geolocation.watchPosition(p => {
      const pos = { lat: p.coords.latitude, lng: p.coords.longitude };
      if (!myDot) myDot = new google.maps.Marker({ position: pos, map, zIndex: 999, title: 'You',
        icon: { path: google.maps.SymbolPath.CIRCLE, scale: 7, fillColor: '#4a8ff0', fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2 } });
      else myDot.setPosition(pos);
    }, () => {}, { enableHighAccuracy: true, maximumAge: 30000 });
  };
  const s = document.createElement('script');
  s.src = 'https://maps.googleapis.com/maps/api/js?key=' + MAPS_KEY + '&callback=initMap';
  s.async = true; s.onerror = () => { $('#map').innerHTML = '<div class="empty">Map could not load (offline?)</div>'; mapLoading = false; };
  document.head.appendChild(s);
}
function renderMap() {
  if (!map) return;
  markers.forEach(m => m.setMap(null)); markers = [];
  const techs = [...new Set(jobs.map(j => j.tech))].sort();
  const t = todayISO();
  const bounds = new google.maps.LatLngBounds();
  jobs.filter(j => j.lat).forEach(j => {
    const color = session.user.admin && techFilter === 'ALL' ? TECH_HUES[techs.indexOf(j.tech) % TECH_HUES.length]
      : !j.appt ? '#8a8aa0' : j.appt.date < t ? '#e06a6a' : j.appt.date === t ? '#4fb37f' : '#6aa4e0';
    const m = new google.maps.Marker({ position: { lat: j.lat, lng: j.lng }, map, title: (j.company || j.cni) + ' · ' + j.cni,
      label: session.user.admin && techFilter === 'ALL' ? { text: j.tech, color: '#111', fontSize: '10px', fontWeight: '700' } : null,
      icon: { path: google.maps.SymbolPath.CIRCLE, scale: session.user.admin && techFilter === 'ALL' ? 13 : 10, fillColor: color, fillOpacity: .95, strokeColor: '#111', strokeWeight: 1.5 } });
    m.addListener('click', () => openJob(j.cni));
    markers.push(m); bounds.extend(m.getPosition());
  });
  if (markers.length) { map.fitBounds(bounds, 40); if (markers.length === 1) map.setZoom(13); }
}

// ── Phone notifications (Web Push) ──
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
function pushCard() {
  if (pushSupported() && Notification.permission === 'granted' && store.get('rw_push_on', false)) return '';
  const msg = isIOS && !standalone() ? 'To get notifications on iPhone: Share → <b>Add to Home Screen</b>, open the app from the icon, then tap here.'
    : !pushSupported() ? 'This browser can\'t show notifications.'
    : Notification.permission === 'denied' ? 'Notifications are blocked for this site — allow them in the browser / phone settings.'
    : 'Get a phone notification when a job is pinned or changed, a part is ready, or dispatch asks for an update.';
  const can = pushSupported() && !(isIOS && !standalone()) && Notification.permission !== 'denied';
  return '<div class="card" id="push-card" style="margin-bottom:10px"><div class="small" style="margin-bottom:8px">' + msg + '</div>' +
    (can ? '<button class="act primary" style="width:100%" onclick="enablePush()">🔔 Turn on phone notifications</button>' : '') + '</div>';
}
function b64ToBytes(b) { const s = atob(b.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((b.length + 3) % 4)); return Uint8Array.from(s, c => c.charCodeAt(0)); }
async function enablePush(quiet) {
  try {
    if (!pushSupported()) throw new Error('Not supported in this browser');
    const perm = quiet ? Notification.permission : await Notification.requestPermission();
    if (perm !== 'granted') { if (!quiet) toast('Notifications not allowed'); return; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID_PUBLIC) });
    await api('subscribe', { sub: sub.toJSON() });
    store.set('rw_push_on', true);
    if (!quiet) { toast('Phone notifications on ✓'); const c = $('#push-card'); if (c) c.remove(); }
  } catch (e) { if (!quiet) toast(e.message, 5000); }
}

// Same rules as the relay, so the form is right even before the relay is redeployed
function fixSchema(sc) {
  sc.fields.forEach(f => {
    const l = String(f.label || '').trim();
    if (!l || /^column \d+$/i.test(l) || l === 'Move' || l === 'Move back') f.kind = 'skip';
    else if (/picture|photo|file|image|upload/i.test(l) && f.kind !== 'auto') f.kind = 'files';
    else if (f.col !== 1 && /^\s*(?:cne|wo|work ?order)\s*(?:#|no\.?|number)?\s*$/i.test(l)) f.kind = 'cne';
    if (f.kind === 'agent') f.kind = 'text';

// Photos are shrunk on the phone (max 1600 px, JPEG) before upload
function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve({ name: file.name.replace(/\.\w+$/, '') + '.jpg', data: c.toDataURL('image/jpeg', 0.8) });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read ' + file.name)); };
    img.src = url;
  });
}
async function closureFiles() {
  const f = schema.fields.find(x => x.kind === 'files');
  const el = f && $('#f_' + f.key);
  if (!el || !el.files.length) return [];
  return Promise.all([...el.files].slice(0, 10).map(shrink));
}

  if (!confirm('Submit the closure for CNI ' + cni + '?')) return;
  const b = $('#cf-send'); b.disabled = true; b.innerHTML = '<span class="spin"></span> Sending…';

// ── Offline queue ─────────────────────────────────────────────────────────
// Contact attempts, Teams updates, visit times, notes and closures made with no signal are kept

const QUEUE_OPS = ['contact', 'update', 'visit', 'note', 'close'];
const idb = {

      r.onupgradeneeded = () => r.result.createObjectStore('outbox', { keyPath: 'id', autoIncrement: true });
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async tx(mode, fn) {
    const db = await this.open();

      t.onerror = () => rej(t.error);
    });
  },
  add(item) { return this.tx('readwrite', st => st.add(item)); },
  all() { return this.tx('readonly', st => st.getAll()); },
  del(id) { return this.tx('readwrite', st => st.delete(id)); },

    await idb.add({ op, extra, label: label || op, at: new Date().toISOString(), user: session.user.name });
    await countQueue();

    return { ok: true, queued: true };
  }
}

async function flushQueue() {

  flushing = true;

    const items = (await idb.all()).filter(i => i.user === session.user.name).sort((a, b) => a.id - b.id);
    let sent = 0;
    for (const it of items) {
      try { await api(it.op, it.extra); sent++; await idb.del(it.id); }
      catch (e) {
        if (e.offline) break;                                   // still no signal: try again later
        await idb.del(it.id);

}

// ── Barcode scanner (serial / tracking) ───────────────────────────────────
// BarcodeDetector where the phone has it (Android Chrome); otherwise ZXing from a CDN.
let scanStop = null;
// A FedEx tracking number from whatever barcode was read, or '' if it isn't one:
//  • 12 / 15 digits: the tracking number itself
//  • 34 digits (Express 1D barcode): the last 12
//  • 22 digits starting 96 (Ground "96" barcode): the last 15
//  • PDF417 / 2D (the big square): fields split by GS; the tracking number is a 12- or 15-digit field
function fedexTracking(raw) {
  const s = String(raw || '');
  const d = s.replace(/\D/g, '');
  if (/^\d+$/.test(s.trim())) {
    if (d.length === 12 || d.length === 15) return d;
    if (d.length === 34 || d.length === 32 || d.length === 33) return d.slice(-12);
    if (d.length === 22 && d.startsWith('96')) return d.slice(-15);
    if (d.length === 20 || d.length === 21) return d.slice(-12);
    return '';
  }
  const fields = s.split(/[\x1d\x1e\x04]|\|/).map(x => x.trim());
  const f = fields.find(x => /^\d{12}$/.test(x) || /^\d{15}$/.test(x));
  if (f) return f;
  const m = s.match(/(?<!\d)(\d{12}|\d{15})(?!\d)/);
  return m ? m[1] : '';
}
// "S MXL4263VLY", "SN:5CG2201ABC" → serial; part numbers ("P/N …") are skipped
function serialFrom(raw) {

  return s.replace(/^(?:s\/?n|serial(?: no\.?)?|s)[\s:#-]*/i, '').replace(/\s+/g, '').toUpperCase();

const SCAN_FORMATS = ['code_128', 'pdf417', 'code_39', 'code_93', 'itf', 'data_matrix', 'qr_code', 'ean_13', 'ean_8', 'upc_a', 'upc_e', 'codabar'];
async function loadZXing() {

    s.src = 'https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js';
    s.onload = res; s.onerror = () => rej(new Error('The scanner needs a signal the first time it loads'));

}
function zxReader() {

  h.set(ZXing.DecodeHintType.TRY_HARDER, true);

// Decode every barcode in a still photo (much sharper than video, best for the dense FedEx codes).
// The photo is drawn on a canvas (max 2000 px) and also tried turned 90°, as labels are often shot sideways.
async function codesInPhoto(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    if ('BarcodeDetector' in window) {
      try { const r = await new BarcodeDetector({ formats: SCAN_FORMATS }).detect(img); if (r.length) return r.map(x => x.rawValue); } catch (e) {}
    }
    await loadZXing();
    // Big photos are shrunk to 2000 px on the long side (phone photos are 4000+); small ones kept as they are
    const k = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    const reader = new ZXing.MultiFormatReader();
    const out = new Set();
    // A label has several barcodes and a decoder returns one per try: the whole photo, then bands of it
    const bands = [[0, 1], [0, .4], [.3, .7], [.6, 1], [0, .55], [.45, 1]];
    for (const turn of [0, 90]) {
      const W = turn ? h : w, H = turn ? w : h;
      const full = document.createElement('canvas'); full.width = W; full.height = H;
      const fg = full.getContext('2d');
      fg.fillStyle = '#fff'; fg.fillRect(0, 0, W, H);
      if (turn) { fg.translate(W, 0); fg.rotate(Math.PI / 2); }
      fg.drawImage(img, 0, 0, w, h);

        const pad = 40, c = document.createElement('canvas');   // white margin: tightly cropped photos decode too

        const g = c.getContext('2d');
        g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);

    }

}

  });
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 }, focusMode: 'continuous' } });
    video.srcObject = stream; await video.play();
    const track = stream.getVideoTracks()[0];
    try { const caps = track.getCapabilities ? track.getCapabilities() : {}; if (caps.focusMode && caps.focusMode.includes('continuous')) await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {}
    let torch = false;
    ov.querySelector('#scan-torch').onclick = async () => { try { torch = !torch; await track.applyConstraints({ advanced: [{ torch }] }); } catch (e) { toast('No light control on this phone'); } };
    let alive = true;
    if ('BarcodeDetector' in window) {
      const det = new BarcodeDetector({ formats: SCAN_FORMATS });
      scanStop = () => { alive = false; stream.getTracks().forEach(t => t.stop()); };
      const tick = async () => {
        if (!alive || finished) return;
        try { const r = await det.detect(video); if (r.length && consider(r.map(x => x.rawValue))) return; } catch (e) {}
        setTimeout(tick, 120);
      };
      tick();
    } else {
      msg.textContent = 'Loading scanner…';
      await loadZXing();
      msg.textContent = tracking ? 'Fill the box with the barcode under "TRK#", or the big square one. Hold steady.' : 'Point at the serial number barcode…';
      const reader = zxReader();
      scanStop = () => { alive = false; try { reader.reset(); } catch (e) {} stream.getTracks().forEach(t => t.stop()); };
      reader.decodeFromStream(stream, video, res => { if (res && alive) consider([res.getText()]); });
    }
  } catch (e) {
    msg.textContent = /permission|denied|NotAllowed/i.test(e.message) ? 'Camera blocked — allow it in the browser settings, or use 📸 Photo' : e.message + ' — use 📸 Photo';
  }
}
function stopScan() { if (scanStop) { try { scanStop(); } catch (e) {} scanStop = null; } const o = $('#scanner'); if (o) o.remove(); }
const scanBtn = (id, label, append) => '<button type="button" class="act" style="margin-top:6px" onclick="scanInto(\'' + id + '\'' + (append ? ',\'' + append + '\'' : '') + ')">📷 ' + label + '</button>';

// ── Route for the day ─────────────────────────────────────────────────────
const toRad = x => x * Math.PI / 180;
function miles(a, b) {
  const R = 3958.8, dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
// Nearest neighbour from the start, then 2-opt until nothing improves
function orderStops(start, stops) {
  let rest = stops.slice(), cur = start || rest[0], route = [];
  if (!start) { route.push(rest.shift()); cur = route[0]; }
  while (rest.length) {
    let bi = 0; rest.forEach((s, i) => { if (miles(cur, s) < miles(cur, rest[bi])) bi = i; });
    cur = rest.splice(bi, 1)[0]; route.push(cur);
  }
  const pts = start ? [start].concat(route) : route.slice();
  const len = p => p.slice(1).reduce((s, x, i) => s + miles(p[i], x), 0);
  let better = true;
  while (better) {
    better = false;
    for (let i = 1; i < pts.length - 1; i++) for (let k = i + 1; k < pts.length; k++) {
      const cand = pts.slice(0, i).concat(pts.slice(i, k + 1).reverse(), pts.slice(k + 1));
      if (len(cand) + 0.01 < len(pts)) { pts.splice(0, pts.length, ...cand); better = true; }
    }
  }
  return start ? pts.slice(1) : pts;
}
function hereNow() {
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude }), () => res(null), { timeout: 6000, maximumAge: 300000 });
  });
}
function routeDay() {
  const t = todayISO();
  const days = [...new Set(jobs.filter(j => j.appt && j.appt.date >= t && j.lat).map(j => j.appt.date))].sort();
  return days[0] || null;
}
async function openRoute() {
  const day = routeDay();
  if (!day) { toast('No scheduled jobs with an address yet'); return; }
  const stops = jobs.filter(j => j.appt && j.appt.date === day && j.lat);
  sheet('Route · ' + (day === todayISO() ? 'Today' : nice(day)), '<div class="empty"><span class="spin"></span> Finding the shortest order…</div>');
  const here = await hereNow();
  const order = orderStops(here, stops);
  let total = 0, prev = here;
  const rows = order.map((j, i) => {
    const leg = prev ? miles(prev, j) : 0; total += leg; prev = j;
    return '<div class="card job" onclick="closeSheet();openJob(\'' + j.cni + '\')"><div class="row between"><span class="co">' + (i + 1) + '. ' + esc(j.company || j.customer || 'CNI ' + j.cni) + '</span>' + apptChip(j) + '</div>' +
      '<div class="meta">' + esc(j.address || j.city || '') + '</div>' +
      '<div class="small">' + (prev && (i || here) ? '≈ ' + leg.toFixed(1) + ' mi' + (i === 0 ? ' from you' : ' from stop ' + i) + ' · ' : '') + 'CNI ' + esc(j.cni) + '</div></div>';
  });
  const pt = j => j.lat + ',' + j.lng;
  const legs = [];                                          // Google Maps takes up to 9 stops between start and end
  for (let i = 0; i < order.length; i += 10) legs.push(order.slice(i, i + 10));
  const links = legs.map((g, n) => {
    const dest = g[g.length - 1], way = g.slice(0, -1);
    const origin = n === 0 ? (here ? pt(here) : '') : pt(legs[n - 1][legs[n - 1].length - 1]);
    return '<a class="act primary" style="display:block;margin-top:8px;text-align:center" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&travelmode=driving' +
      (origin ? '&origin=' + origin : '') + '&destination=' + pt(dest) + (way.length ? '&waypoints=' + way.map(pt).join('|') : '') + '">▶ Open ' +
      (legs.length > 1 ? 'part ' + (n + 1) + ' (stops ' + (n * 10 + 1) + '–' + (n * 10 + g.length) + ')' : 'route') + ' in Google Maps</a>';
  }).join('');
  const timed = order.filter(j => j.appt && j.appt.time).length;
  $('#sheet-body').innerHTML = '<div class="card"><b>' + order.length + ' stop' + (order.length === 1 ? '' : 's') + '</b> · ≈ ' + total.toFixed(0) + ' mi straight-line' +
      (here ? ' from where you are' : '') + (timed ? '<div class="small" style="margin-top:4px">⚠ ' + timed + ' stop' + (timed === 1 ? ' has' : 's have') + ' a set time — check the order against them.</div>' : '') + '</div>' +
    links + '<div style="margin-top:12px">' + rows.join('') + '</div>';
}

// ── Pay this period (tech) ────────────────────────────────────────────────
let payOffset = 0;
async function renderPay() {
  const el = view === 'admin' ? $('#admin-body') : $('#view-pay');
  if (!el || (view !== 'pay' && !(view === 'admin' && adminTab === 'pay'))) return;
  if (session.user.admin && techFilter === 'ALL') { el.innerHTML = '<div class="empty">Pick a tech at the top to see their pay estimate</div>'; return; }
  el.innerHTML = '<div class="empty"><span class="spin"></span> Adding up your closures…</div>';
  try {
    const p = await api('pay', { offset: payOffset, tech: techFilter });
    const kind = { computer: 'Computer', printer: 'Printer', trip: 'Trip' };
    el.innerHTML = '<div class="row between" style="margin:8px 4px"><button class="act" onclick="payOffset++;renderPay()">‹ Earlier</button>' +
        '<b>' + esc(p.period.label) + '</b><button class="act" onclick="payOffset=Math.max(0,payOffset-1);renderPay()"' + (payOffset ? '' : ' disabled') + '>Later ›</button></div>' +
      '<div class="card"><div class="row between"><span class="co">Estimated pay' + (session.user.admin ? ' · ' + esc(p.tech) : '') + '</span><b style="font-size:22px">$' + p.total + '</b></div>' +
        '<div class="small" style="margin-top:4px">' + p.counts.computer + ' computer · ' + p.counts.printer + ' printer · ' + p.counts.trip + ' trip</div></div>' +
      (p.items.length ? p.items.map(i => '<div class="card job" onclick="openJob(\'' + i.cni + '\')"><div class="row between"><span class="co">' + esc(i.company || 'CNI ' + i.cni) + '</span><b>$' + i.pay + '</b></div>' +
        '<div class="small">' + esc(nice(i.day)) + ' · CNI ' + esc(i.cni) + ' · ' + kind[i.kind] + (i.ok ? '' : ' · not fixed') + (i.dup ? ' · <span style="color:var(--amber)">another visit this period</span>' : '') + '</div></div>').join('')
        : '<div class="empty">No closures in this period yet</div>') +
      '<div class="small" style="margin:10px 4px">' + esc(p.note) + '</div>';
  } catch (e) { el.innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }
}

// ── Admin: dashboard, search, scorecards ──────────────────────────────────
let adminTab = store.get('rw_admin_tab', 'dash'), searchQ = '', searchT = null, scoreDays = 60;
function renderAdmin() {
  const el = $('#view-admin');
  if (!el || view !== 'admin') return;
  el.innerHTML = '<div class="seg" style="margin:8px 4px 10px">' + [['dash', 'Dashboard'], ['search', 'Search'], ['score', 'Scorecards'], ['pay', 'Pay']].map(([k, l]) =>
    '<button class="' + (adminTab === k ? 'on' : '') + '" onclick="adminTab=\'' + k + '\';store.set(\'rw_admin_tab\',adminTab);renderAdmin()">' + l + '</button>').join('') + '</div><div id="admin-body"></div>';
  if (adminTab === 'dash') renderDash(); else if (adminTab === 'search') renderSearch(); else if (adminTab === 'pay') renderPay(); else renderScores();
}
const jobRow = (r, extra) => '<div class="card job" onclick="openJob(\'' + r.cni + '\')"><div class="row between"><span class="co">' + esc(r.company || 'CNI ' + r.cni) + '</span><b>' + esc(r.tech) + '</b></div>' +
  '<div class="small">CNI ' + esc(r.cni) + (r.city ? ' · ' + esc(r.city) : '') + (extra ? ' · ' + extra : '') + '</div></div>';
async function renderDash() {
  const box = $('#admin-body');
  box.innerHTML = '<div class="empty"><span class="spin"></span></div>';
  try {
    const d = await api('dashboard');
    const th = 'style="text-align:right;padding:4px 6px"';
    const cell = (v, warn) => '<td ' + th + '>' + (v ? '<span style="color:var(--' + (warn ? 'red' : 'text') + ')">' + v + '</span>' : '<span style="color:var(--sub)">0</span>') + '</td>';
    const table = '<div class="card" style="overflow-x:auto;padding:8px"><table style="width:100%;border-collapse:collapse;font-size:13px">' +
      '<tr style="color:var(--sub);font-size:11px"><td style="padding:4px 6px">Tech</td><td ' + th + '>Open</td><td ' + th + '>Today</td><td ' + th + '>Not sched.</td><td ' + th + '>No contact</td><td ' + th + '>Past SLA</td><td ' + th + '>Stale</td></tr>' +
      d.techs.map(t => '<tr style="border-top:1px solid var(--line)"><td style="padding:4px 6px"><a href="#" onclick="event.preventDefault();pickTech(\'' + esc(t.tech) + '\');$(\'#tech-pick\').value=\'' + esc(t.tech) + '\';show(\'jobs\')"><b>' + esc(t.tech) + '</b></a></td>' +
        cell(t.open) + cell(t.today) + cell(t.unscheduled) + cell(t.uncontacted, 1) + cell(t.pastLsdt, 1) + cell(t.stale, 1) + '</tr>').join('') + '</table></div>';
    const lsdt = r => { const t = Date.parse(r.lsdt); return isNaN(t) ? '' : 'SLA ' + new Date(t).toLocaleString([], { month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit' }); };
    const sec = (title, list, extra) => list.length ? '<div class="group">' + title + ' · ' + list.length + '</div>' + list.slice(0, 25).map(r => jobRow(r, extra(r))).join('') : '';
    box.innerHTML = '<div class="small" style="margin:0 4px 6px">' + d.total + ' open jobs</div>' + table +
      sec('⏰ Past SLA, not scheduled ahead', d.lists.pastLsdt, lsdt) +
      sec('⏳ SLA in the next 24 h, not scheduled', d.lists.lsdtSoon, lsdt) +
      sec('📞 3+ contact attempts', d.lists.attempts3, r => r.attempts + ' attempts') +
      sec('🆕 Not scheduled and no contact logged', d.lists.uncontacted, r => r.idleDays != null ? r.idleDays + ' d since last activity' : '') +
      sec('💤 No update in ' + d.staleDays + '+ days', d.lists.stale, r => r.idleDays + ' days') +
      (d.partsDue.length ? '<div class="group">📦 Parts at their last pickup day · ' + d.partsDue.length + '</div>' + d.partsDue.map(p =>
        '<div class="card job" onclick="openJob(\'' + p.cni + '\')"><div class="row between"><span class="co">' + esc(p.where || p.tracking) + '</span><b>' + esc(p.tech) + '</b></div>' +
        '<div class="small">' + esc(p.tracking) + ' · CNI ' + esc(p.cni) + ' · ' + (p.daysLeft < 0 ? 'past last pickup day' : p.daysLeft === 0 ? 'last day today' : 'last day tomorrow') + '</div></div>').join('') : '');
  } catch (e) { box.innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }
}
function renderSearch() {
  $('#admin-body').innerHTML = '<input class="search" id="sq" placeholder="CNI, WO, customer, address, serial, tracking…" value="' + esc(searchQ) + '" oninput="searchQ=this.value;clearTimeout(searchT);searchT=setTimeout(runSearch,500)">' +
    '<div class="small" style="margin:4px 4px 8px">Open jobs and closures from the last few months · NSA work orders too</div><div id="sres"></div>';
  $('#sq').focus();
  if (searchQ.trim().length >= 3) runSearch();
}
async function runSearch() {
  const box = $('#sres'); if (!box) return;
  const q = searchQ.trim();
  if (q.length < 3) { box.innerHTML = ''; return; }
  box.innerHTML = '<div class="empty"><span class="spin"></span></div>';
  try {
    const r = (await api('search', { q })).results;
    if (searchQ.trim() !== q) return;
    box.innerHTML = r.length ? r.map(x => '<div class="card job"' + (x.cni ? ' onclick="openJob(\'' + x.cni + '\')"' : '') + '><div class="row between"><span class="co">' + esc(x.company || (x.nsa ? 'NSA ' + x.nsa : 'CNI ' + x.cni)) + '</span>' +
      (x.open ? '<span class="chip green">Open</span>' : '<span class="chip">Closed' + (x.closed && x.closed.day ? ' ' + esc(shortDate(x.closed.day + 'T12:00')) : '') + '</span>') + '</div>' +
      '<div class="small">' + (x.nsa ? 'NSA ' + esc(x.nsa) : 'CNI ' + esc(x.cni)) + (x.tech ? ' · ' + esc(x.tech) : '') + (x.city ? ' · ' + esc(x.city) : '') + '</div>' +
      '<div class="small" style="margin-top:2px;color:var(--sub)">' + esc(x.match) + '</div></div>').join('') : '<div class="empty">Nothing found</div>';
  } catch (e) { box.innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }
}
async function renderScores() {
  const box = $('#admin-body');
  box.innerHTML = '<div class="seg" style="margin:0 4px 10px">' + [30, 60, 90].map(n => '<button class="' + (scoreDays === n ? 'on' : '') + '" onclick="scoreDays=' + n + ';renderScores()">' + n + ' days</button>').join('') +
    '</div><div id="scores"><div class="empty"><span class="spin"></span></div></div>';
  try {
    const d = await api('scorecards', { days: scoreDays });
    const v = (x, unit) => x == null ? '<span style="color:var(--sub)">–</span>' : x + (unit || '');
    $('#scores').innerHTML = d.cards.length ? d.cards.map(c => '<div class="card"><div class="row between"><span class="co">' + esc(c.name) + '</span><b>' + esc(c.tech) + '</b></div>' +
      '<dl class="kv" style="margin-top:6px">' +
        '<dt>Jobs closed</dt><dd>' + c.jobs + (c.trips ? ' (' + c.trips + ' trip' + (c.trips === 1 ? '' : 's') + ')' : '') + '</dd>' +
        '<dt>First-time fix</dt><dd>' + v(c.ftfRate, '%') + '</dd>' +
        '<dt>Days to schedule</dt><dd>' + v(c.daysToSchedule) + '</dd>' +
        '<dt>Days to first visit</dt><dd>' + v(c.daysToVisit) + '</dd>' +
        '<dt>Days to close</dt><dd>' + v(c.daysToClose) + '</dd>' +
        '<dt>Parts returned (tracking given)</dt><dd>' + v(c.returnRate, '%') + (c.partsUsed ? ' of ' + c.partsUsed : '') + '</dd>' +
      '</dl></div>').join('') + '<div class="small" style="margin:8px 4px">From closure forms in the last ' + d.days + ' days. Days are counted from when the job was dispatched. ' +
      '"Days to schedule" only covers jobs scheduled with the app\'s 📅 button.</div>'
      : '<div class="empty">No closures in this window</div>';
  } catch (e) { $('#scores').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12121a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rewind">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Rewind Jobs</title>
<style>
  :root {
    --bg: #12121a; --panel: #1a1a26; --panel2: #222232; --line: #2c2c40;
    --text: #f2f2f6; --sub: #a0a0b4; --dim: #6c6c82;
    --accent: #d8a86a; --green: #4fb37f; --blue: #6aa4e0; --red: #e06a6a; --amber: #e8a83a;
    --radius: 12px; color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f3f2ee; --panel: #ffffff; --panel2: #f0efea; --line: #dddcd4;
    --text: #1b1b22; --sub: #5d5d6b; --dim: #9a9aa6;
    --accent: #a8742e; --green: #23875a; --blue: #2f6db0; --red: #c03f3f; --amber: #b0761a; color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text);
         display: flex; flex-direction: column; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: var(--blue); }
  .hidden { display: none !important; }

  /* Top bar */
  header { display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
           background: var(--panel); border-bottom: 1px solid var(--line); flex-shrink: 0; }
  header .brand { font-weight: 800; letter-spacing: .02em; }
  header .who { font-size: 12px; color: var(--sub); }
  header .grow { flex: 1; min-width: 0; }
  header { flex-wrap: wrap; }
  header select { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13px;
                  order: 10; flex: 1 1 100%; }
  .icon-btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 14px; line-height: 1; }
  #stamp { font-size: 11px; color: var(--dim); padding: 4px 16px; background: var(--bg); flex-shrink: 0; }
  #stamp.offline { color: var(--amber); }

  /* Views */
  main { flex: 1; min-height: 0; position: relative; }
  .view { position: absolute; inset: 0; overflow-y: auto; padding: 8px 12px 16px; }
  #view-map { padding: 0; overflow: hidden; }
  #map { width: 100%; height: 100%; background: var(--panel2); }
  @media (min-width: 900px) {
    main.split #view-jobs, main.split #view-today { right: 50%; }
    main.split #view-map { left: 50%; display: block !important; border-left: 1px solid var(--line); }
  }

  /* Bottom tabs */
  nav { display: flex; background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); flex-shrink: 0; }
  nav button { flex: 1; background: none; border: none; padding: 9px 4px 8px; font-size: 11px; color: var(--sub); display: flex; flex-direction: column; align-items: center; gap: 2px; }
  nav button b { font-size: 19px; line-height: 1; font-weight: 400; }
  nav button.on { color: var(--accent); }
  #bell-badge .badge { position: absolute; top: -6px; right: -6px; margin: 0; }
  .notif { cursor: pointer; }
  .notif.unread { border-left: 3px solid var(--accent); }
  .notif .t { font-weight: 700; font-size: 14px; }
  .notif:not(.unread) .t { font-weight: 500; color: var(--sub); }
  nav .badge { background: var(--red); color: #fff; border-radius: 9px; font-size: 10px; padding: 0 5px; margin-left: 3px; }

  /* Lists */
  .group { font-size: 12px; font-weight: 700; color: var(--dim); text-transform: uppercase; letter-spacing: .07em; margin: 14px 4px 6px; }
  .group:first-child { margin-top: 6px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; }
  .job { cursor: pointer; }
  .job:active { background: var(--panel2); }
  .row { display: flex; align-items: center; gap: 8px; }
  .between { justify-content: space-between; }
  .co { font-weight: 700; }
  .meta { font-size: 13px; color: var(--sub); }
  .small { font-size: 12px; color: var(--dim); }
  .chip { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--panel2); color: var(--sub); white-space: nowrap; }
  .chip.green { color: var(--green); } .chip.amber { color: var(--amber); } .chip.red { color: var(--red); } .chip.blue { color: var(--blue); }
  .empty { text-align: center; color: var(--dim); padding: 40px 16px; }
  .search { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; margin: 4px 0 6px; }

  /* Sheets (details, closure) */
  .sheet { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; }
  .sheet-head { display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .sheet-head .t { flex: 1; font-weight: 800; }
  .sheet-body { flex: 1; overflow-y: auto; padding: 12px 12px calc(24px + env(safe-area-inset-bottom)); }
  .sec { margin-top: 14px; }
  .sec h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--dim); margin: 0 4px 6px; }
  .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .act { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 6px; text-align: center; font-size: 13px; font-weight: 600; text-decoration: none; color: var(--text); }
  .act:active { background: var(--panel2); }
  .act.primary { background: var(--accent); color: #1b1408; border-color: var(--accent); }
  .act.wide { grid-column: span 3; padding: 13px; font-size: 15px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 13px; }
  .kv dt { color: var(--dim); } .kv dd { word-break: break-word; }
  .pre { white-space: pre-wrap; font-size: 13px; }
  .feed .item { border-left: 2px solid var(--line); padding: 2px 0 8px 10px; }
  .feed .item .h { font-size: 12px; color: var(--dim); }
  .feed .item.hem { border-left-color: var(--amber); }

  /* Forms */
  label.f { display: block; margin-bottom: 12px; }
  label.f span { display: block; font-size: 13px; color: var(--sub); margin-bottom: 4px; }
  label.f span i { color: var(--red); font-style: normal; }
  input.in, select.in, textarea.in { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; }
  textarea.in { min-height: 90px; resize: vertical; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 8px 12px; font-size: 14px; }
  .seg button.on { border-color: var(--accent); color: var(--accent); font-weight: 700; }

  /* Login */
  #login { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 24px; }
  #login .box { width: 100%; max-width: 320px; text-align: center; }
  #login h1 { font-size: 22px; margin-bottom: 4px; }
  #login p { color: var(--sub); font-size: 14px; margin-bottom: 20px; }
  #code { width: 100%; text-align: center; font-size: 26px; letter-spacing: .35em; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  #login .err { color: var(--red); min-height: 20px; margin-top: 10px; font-size: 14px; }

  /* Toast */
  #toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 200;
           background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: 90vw; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s .8s linear infinite; vertical-align: -2px; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h1>Rewind Repair</h1>
    <p>Enter your 6-digit code</p>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="••••••">
    <button class="act primary wide" style="width:100%;margin-top:12px" onclick="login()">Sign in</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<header>
  <div class="grow">
    <div class="brand">Rewind Jobs</div>
    <div class="who" id="who"></div>
  </div>
  <select id="tech-pick" class="hidden" onchange="pickTech(this.value)"></select>
  <button class="icon-btn" onclick="openNotifs()" title="Notifications" style="position:relative">🔔<span id="bell-badge"></span></button>
  <button class="icon-btn" onclick="refresh(true)" title="Refresh">↻</button>
  <button class="icon-btn" onclick="toggleTheme()" title="Light / dark" id="theme-btn">◐</button>
  <button class="icon-btn" onclick="if(confirm('Sign out?'))logout()" title="Sign out" style="font-size:12px">Sign out</button>
</header>
<div id="stamp"></div>

<main id="main" class="split">
  <section class="view" id="view-today"></section>
  <section class="view hidden" id="view-jobs"></section>
  <section class="view hidden" id="view-map"><div id="map"></div></section>
  <section class="view hidden" id="view-parts"></section>
</main>

<nav>
  <button data-v="today" class="on" onclick="show('today')"><b>◷</b>Today</button>
  <button data-v="jobs" onclick="show('jobs')"><b>☰</b>Jobs</button>
  <button data-v="map" onclick="show('map')"><b>⌖</b>Map</button>
  <button data-v="parts" onclick="show('parts')"><b>▣</b><span>Parts<span id="parts-badge"></span></span></button>
</nav>

<div id="toast"></div>

<script>
// ── Config ────────────────────────────────────────────────────────────────
// Nord Claude's relay (Apps Script web app). Codes are checked there, never in this page.
const API = 'https://script.google.com/macros/s/AKfycbwBvMfaJCj-UDoE-Oa9jEcIYxy4XIT2v9hFHJ-kqkEHOs8afDBxL9KZiufacb1gVsATlQ/exec';
const MAPS_KEY = 'AIzaSyBvtDmQkxaYjYffIyJYYH7I0waSvuKF3Eg';
const AUTO_REFRESH_MIN = 5;
const APP_VERSION = '3.10';
const VAPID_PUBLIC = 'BP2C2HFEMyUFpKCzr7F5zXXF8RI12OnaS-eZohOoQmsoIXI3K9mclMpeti1Ey6-SpcI04Lp-SSR6rOHt0be9Q3E';   // phone notifications (the private half lives in the rewind-push worker)

// ── Small helpers ─────────────────────────────────────────────────────────
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
function toast(msg, ms) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), ms || 2600);
}
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const nice = iso => new Date(iso + 'T12:00').toLocaleDateString([], { weekday: 'short', month: 'numeric', day: 'numeric' });
// Phone numbers: "+1…", "(303) …", "303-555-…" anywhere; a bare 10-digit run only after a phone label
// (CNE / WO numbers are 10 digits too)
function phonesIn(text) {
  const t = String(text || ''), out = [];
  const re = /(\+?1[\s.-]?)?(\(?\d{3}\)?)([\s.-]?)(\d{3})([\s.-]?)(\d{4})(?!\d)/g;
  let m;
  while ((m = re.exec(t))) {
    if (m.index > 0 && /\d/.test(t[m.index - 1])) continue;
    const formatted = (m[1] && m[1].includes('+')) || /[()]/.test(m[2]) || m[3] || m[5];
    const labelled = /(phone|tel|mobile|cell|contact|call|ph|☎|📞)[^\n\d]{0,20}$/i.test(t.slice(Math.max(0, m.index - 30), m.index));
    if (!formatted && !labelled) continue;
    const d = m[0].replace(/\D/g, '').replace(/^1(?=\d{10}$)/, '');
    if (d.length === 10 && !out.includes(d)) out.push(d);
  }
  return out.map(d => '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6));
}
const shortDate = s => { const t = Date.parse(s); return isNaN(t) ? '' : new Date(t).toLocaleDateString([], { month: 'numeric', day: 'numeric' }); };
const navUrl = j => j.lat ? 'https://www.google.com/maps/dir/?api=1&destination=' + j.lat + ',' + j.lng
                          : 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(j.address || j.loc || j.city);

// ── API ───────────────────────────────────────────────────────────────────
let session = store.get('rw_session', null);   // { pin, user, techs }
async function api(op, extra) {
  const res = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ action: 'app', op, pin: session && session.pin }, extra || {})) });
  const j = await res.json();
  if (j.auth) { logout(); throw new Error(j.error || 'Signed out'); }
  if (!j.ok) throw new Error(j.error || 'Something went wrong');
  return j;
}

// ── Login ─────────────────────────────────────────────────────────────────
async function login() {
  const pin = $('#code').value.trim();
  if (!pin) return;
  $('#login-err').innerHTML = '<span class="spin"></span>';
  session = { pin };
  try {
    const j = await api('login');
    session = { pin, user: j.user, techs: j.techs || [] };
    store.set('rw_session', session);
    start();
  } catch (e) { session = null; $('#login-err').textContent = e.message; }
}
function logout() {
  store.del('rw_session'); session = null;
  $('#login').classList.remove('hidden'); $('#code').value = '';
}
$('#code').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

// ── State ─────────────────────────────────────────────────────────────────
let jobs = [], parts = null, view = 'today', techFilter = 'ALL', search = '';
let lastAt = null, offline = false;

function start() {
  $('#login').classList.add('hidden');
  const u = session.user;
  $('#who').textContent = u.name + (u.admin ? ' · admin' : '');
  const sel = $('#tech-pick');
  if (u.admin) {
    techFilter = store.get('rw_tech', 'ALL');
    sel.innerHTML = '<option value="ALL">All techs</option>' + session.techs.map(t =>
      '<option value="' + esc(t.tech) + '">' + esc(t.name) + (t.area ? ' · ' + esc(t.area) : '') + '</option>').join('');
    sel.value = techFilter; sel.classList.remove('hidden');
  } else sel.classList.add('hidden');
  const cached = store.get('rw_jobs_' + u.name + '_' + techFilter, null);
  if (cached) { jobs = cached.jobs; lastAt = cached.at; render(); }
  refresh();
  openFromLink();
  if (pushSupported() && Notification.permission === 'granted') enablePush(true);   // keep the subscription fresh
  clearInterval(start.t); start.t = setInterval(() => { if (!document.hidden) refresh(); }, AUTO_REFRESH_MIN * 60e3);
}
function pickTech(t) { techFilter = t; store.set('rw_tech', t); parts = null; refresh(true); }

async function refresh(loud) {
  if (!session) return;
  stamp('<span class="spin"></span> Updating…');
  if (view === 'parts' || parts === null || loud) loadParts();       // in parallel with the job list
  try {
    const j = await api('jobs', { tech: techFilter });
    jobs = j.jobs; lastAt = j.at; offline = false;
    setUnread(j.unread);
    store.set('rw_jobs_' + session.user.name + '_' + techFilter, { jobs, at: lastAt });
    render();
    if (loud) toast('Up to date');
    setTimeout(prefetchDetails, 1500);
  } catch (e) {
    offline = !navigator.onLine || /fetch|network/i.test(e.message);
    render();
    if (!offline) toast(e.message, 4000);
  }
}
function stamp(html) {
  const s = $('#stamp');
  if (html) { s.innerHTML = html; s.className = ''; return; }
  const when = lastAt ? new Date(lastAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : 'never';
  s.className = offline ? 'offline' : '';
  s.textContent = (offline ? 'Offline — showing jobs from ' : 'Updated ') + when + ' · ' + jobs.length + ' open job' + (jobs.length === 1 ? '' : 's') + ' · v' + APP_VERSION;
}

// ── Views ─────────────────────────────────────────────────────────────────
function show(v) {
  view = v;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  ['today', 'jobs', 'map', 'parts'].forEach(x => $('#view-' + x).classList.toggle('hidden', x !== v));
  $('#main').classList.toggle('split', v === 'today' || v === 'jobs');
  if (v === 'map' || (window.innerWidth >= 900 && (v === 'today' || v === 'jobs'))) { $('#view-map').classList.remove('hidden'); ensureMap(); }
  if (v === 'parts' && parts === null) loadParts();
}
function render() {
  stamp();
  renderToday(); renderJobs(); renderMap(); renderParts();
}

function apptChip(j) {
  if (!j.appt) return '<span class="chip">Not scheduled</span>';
  const t = todayISO(), d = j.appt.date;
  const cls = d < t ? 'red' : d === t ? 'green' : 'blue';
  return '<span class="chip ' + cls + '">' + (d === t ? 'Today' : d === addDays(t, 1) ? 'Tomorrow' : nice(d)) + (j.appt.time ? ' · ' + esc(j.appt.time) : '') + '</span>';
}
function jobCard(j) {
  const admin = session.user.admin && techFilter === 'ALL';
  return '<div class="card job" onclick="openJob(\'' + j.cni + '\')">' +
    '<div class="row between"><span class="co">' + esc(j.company || j.customer || 'CNI ' + j.cni) + '</span>' + apptChip(j) + '</div>' +
    '<div class="meta">' + esc([j.address || j.city, j.device].filter(Boolean).join(' · ')) + '</div>' +
    '<div class="row small" style="margin-top:4px;flex-wrap:wrap">' + (j.assigned && shortDate(j.assigned) ? 'Assigned ' + shortDate(j.assigned) + ' · ' : '') + 'CNI ' + esc(j.cni) + (j.wo ? ' · ' + esc(j.wo) : '') +
      (admin ? ' · <b>' + esc(j.tech) + '</b>' : '') + ' · ' + esc(j.status) + (j.fedex ? ' · 📦' : '') +
      (j.attempts ? ' <span class="chip ' + (j.attempts >= 3 ? 'red' : 'amber') + '">📞 ' + j.attempts + ' attempt' + (j.attempts === 1 ? '' : 's') + '</span>' : '') + '</div>' +
    (j.sched && j.sched[0] ? '<div class="small" style="margin-top:4px">✉ ' + esc(j.sched[0]) + '</div>' : '') +
  '</div>';
}
function renderToday() {
  const el = $('#view-today');
  if (!jobs.length) { el.innerHTML = '<div class="empty">No open jobs 🎉</div>'; return; }
  const t = todayISO(), groups = { over: [], today: [], tomorrow: [], week: [], later: [], none: [] };
  jobs.forEach(j => {
    const d = j.appt && j.appt.date;
    if (!d) groups.none.push(j);
    else if (d < t) groups.over.push(j);
    else if (d === t) groups.today.push(j);
    else if (d === addDays(t, 1)) groups.tomorrow.push(j);
    else if (d <= addDays(t, 7)) groups.week.push(j);
    else groups.later.push(j);
  });
  const byDate = (a, b) => (a.appt ? a.appt.date + (a.appt.time || '') : '9') < (b.appt ? b.appt.date + (b.appt.time || '') : '9') ? -1 : 1;
  const sec = (title, list) => list.length ? '<div class="group">' + title + ' · ' + list.length + '</div>' + list.sort(byDate).map(jobCard).join('') : '';
  el.innerHTML = sec('Today', groups.today) + sec('Past date — reschedule or close', groups.over) + sec('Tomorrow', groups.tomorrow) +
                 sec('Next 7 days', groups.week) + sec('Later', groups.later) + sec('Not scheduled yet', groups.none);
}
function renderJobs() {
  const el = $('#view-jobs');
  const q = search.toLowerCase();
  const list = jobs.filter(j => !q || [j.cni, j.wo, j.company, j.customer, j.address, j.city, j.device, j.tech].join(' ').toLowerCase().includes(q))
    .sort((a, b) => (a.city || '').localeCompare(b.city || '') || (a.company || '').localeCompare(b.company || ''));
  el.innerHTML = '<input class="search" placeholder="Search CNI, WO, company, city…" value="' + esc(search) + '" oninput="search=this.value;renderJobsList()">' +
                 '<div id="jobs-list"></div>';
  renderJobsList();
}
function renderJobsList() {
  const q = search.toLowerCase();
  const list = jobs.filter(j => !q || [j.cni, j.wo, j.company, j.customer, j.address, j.city, j.device, j.tech].join(' ').toLowerCase().includes(q))
    .sort((a, b) => (a.city || '').localeCompare(b.city || '') || (a.company || '').localeCompare(b.company || ''));
  const box = $('#jobs-list');
  if (box) box.innerHTML = list.length ? list.map(jobCard).join('') : '<div class="empty">Nothing matches</div>';
}

// ── Map ───────────────────────────────────────────────────────────────────
let map = null, markers = [], mapLoading = false, myDot = null;
const TECH_HUES = ['#6aa4e0', '#4fb37f', '#e8a83a', '#c27ae0', '#e06a6a', '#3ac2c2', '#d8d86a', '#e07ab4', '#8a8ae0', '#a0c25a', '#e0956a', '#5ab4e0', '#b4a07a'];
function ensureMap() {
  if (map || mapLoading) return;
  mapLoading = true;

      if (!myDot) myDot = new google.maps.Marker({ position: pos, map, zIndex: 999, title: 'You',
        icon: { path: google.maps.SymbolPath.CIRCLE, scale: 7, fillColor: '#4a8ff0', fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2 } });
      else myDot.setPosition(pos);

}
function renderMap() {
  if (!map) return;

  const techs = [...new Set(jobs.map(j => j.tech))].sort();
  const t = todayISO();
  const bounds = new google.maps.LatLngBounds();
  jobs.filter(j => j.lat).forEach(j => {
    const color = session.user.admin && techFilter === 'ALL' ? TECH_HUES[techs.indexOf(j.tech) % TECH_HUES.length]
      : !j.appt ? '#8a8aa0' : j.appt.date < t ? '#e06a6a' : j.appt.date === t ? '#4fb37f' : '#6aa4e0';
    const m = new google.maps.Marker({ position: { lat: j.lat, lng: j.lng }, map, title: (j.company || j.cni) + ' · ' + j.cni,
      label: session.user.admin && techFilter === 'ALL' ? { text: j.tech, color: '#111', fontSize: '10px', fontWeight: '700' } : null,

    m.addListener('click', () => openJob(j.cni));

  if (markers.length) { map.fitBounds(bounds, 40); if (markers.length === 1) map.setZoom(13); }

let unread = 0, notifs = [];
function setUnread(n) {

}

    '<button class="act" style="padding:6px 12px" onclick="markRead(null)">Mark all read</button></div><div id="n-list"><div class="empty"><span class="spin"></span></div></div>');
  try { const j = await api('notifs'); notifs = j.notifs; setUnread(j.unread); renderNotifs(); }

function renderNotifs() {

  $('#n-list').innerHTML = notifs.length ? notifs.map(n =>

    '</div>').join('') : '<div class="empty">No notifications in the last 30 days</div>';
}
async function markRead(ids) {
  notifs.forEach(n => { if (!ids || ids.includes(n.id)) n.read = true; });
  setUnread(notifs.filter(n => !n.read).length); renderNotifs();
  try { const j = await api('markread', ids ? { ids } : { all: true }); setUnread(j.unread); } catch (e) { toast(e.message, 4000); }

function tapNotif(id) {

// ── Phone notifications (Web Push) ──
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
function pushCard() {
  if (pushSupported() && Notification.permission === 'granted' && store.get('rw_push_on', false)) return '';
  const msg = isIOS && !standalone() ? 'To get notifications on iPhone: Share → <b>Add to Home Screen</b>, open the app from the icon, then tap here.'
    : !pushSupported() ? 'This browser can\'t show notifications.'
    : Notification.permission === 'denied' ? 'Notifications are blocked for this site — allow them in the browser / phone settings.'
    : 'Get a phone notification when a job is pinned or changed, a part is ready, or dispatch asks for an update.';
  const can = pushSupported() && !(isIOS && !standalone()) && Notification.permission !== 'denied';
  return '<div class="card" id="push-card" style="margin-bottom:10px"><div class="small" style="margin-bottom:8px">' + msg + '</div>' +
    (can ? '<button class="act primary" style="width:100%" onclick="enablePush()">🔔 Turn on phone notifications</button>' : '') + '</div>';
}
function b64ToBytes(b) { const s = atob(b.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((b.length + 3) % 4)); return Uint8Array.from(s, c => c.charCodeAt(0)); }
async function enablePush(quiet) {
  try {
    if (!pushSupported()) throw new Error('Not supported in this browser');
    const perm = quiet ? Notification.permission : await Notification.requestPermission();
    if (perm !== 'granted') { if (!quiet) toast('Notifications not allowed'); return; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID_PUBLIC) });
    await api('subscribe', { sub: sub.toJSON() });
    store.set('rw_push_on', true);
    if (!quiet) { toast('Phone notifications on ✓'); const c = $('#push-card'); if (c) c.remove(); }
  } catch (e) { if (!quiet) toast(e.message, 5000); }
}

  if (d.fieldcode) h += '<div class="sec"><h3>Fieldcode</h3><div class="card">' + kv(d.fieldcode, ['Imported', 'Fieldcode Id']) + '</div></div>';
  if (d.draft) h += '<div class="sec"><h3>Customer</h3><div class="card">' + kv({ Name: d.draft.customer, Email: d.draft.email, Model: d.draft.model, Drafted: d.draft.drafted }) + '</div></div>';
  if (d.index) h += '<div class="sec"><h3>Ticket index</h3><div class="card">' + kv({ Tech: d.index.tech, Location: d.index.location, 'CNE / WO': d.index.cne }) + '</div></div>';
  h += '<div class="sec"><h3>Emails</h3><div id="emails">' + (d.emails ? emailsHtml(d.emails) :
       '<button class="act" style="width:100%" onclick="loadEmails(\'' + d.cni + '\')">Load emails about this ticket</button>') + '</div></div>';
  return h;
}
// The full tech email the drafts script sent (sandboxed: no scripts, no links back into the app)
let lastCard = null;
function cardHtml(c) {
  lastCard = c;
  if (!c) return '<div class="sec"><h3>Dispatch email</h3><div class="small" style="margin:0 4px">Not found — sent before it was saved, or from another Google account.</div></div>';
  if (c.error) return '<div class="sec"><h3>Dispatch email</h3><div class="small" style="margin:0 4px">' + esc(c.error) + '</div></div>';
  const when = c.sent ? new Date(c.sent).toLocaleString([], { month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
  return '<div class="sec"><h3>Dispatch email <span style="text-transform:none;letter-spacing:0">· ' + esc(when) + (c.to ? ' · to ' + esc(c.to) : '') + '</span></h3>' +
    '<div class="card" style="padding:0;overflow:hidden">' +
      '<div class="small" style="padding:8px 12px;border-bottom:1px solid var(--line)">' + esc(c.subject || '') +
        (c.html ? ' · <a href="#" onclick="event.preventDefault();toggleCardView()" id="card-toggle">Show as text</a>' : '') + '</div>' +
      '<div id="card-view">' + cardBody(!!c.html) + '</div>' +
    '</div></div>';
}
function cardBody(formatted) {
  const c = lastCard;
  if (formatted && c.html) {
    return '<iframe sandbox="" referrerpolicy="no-referrer" style="width:100%;height:520px;border:0;background:#fff;display:block" srcdoc="' +
      esc(c.html) + '"></iframe>';
  }
  return '<div class="pre" style="padding:12px;max-height:520px;overflow:auto">' + linkify(c.text || '') + '</div>';
}
function toggleCardView() {
  const v = $('#card-view'), t = $('#card-toggle');
  const toText = t.textContent === 'Show as text';
  v.innerHTML = cardBody(!toText);
  t.textContent = toText ? 'Show formatted' : 'Show as text';
}
function emailsHtml(list) {
  return list.length ? list.map(m => '<div class="card"><div class="small">' + esc(m.date) + ' · ' + esc(m.from) + '</div><div class="co" style="font-size:14px">' + esc(m.subject) + '</div><div class="pre small" style="margin-top:4px">' + esc(m.text) + '</div></div>').join('')
                     : '<div class="empty">No emails found</div>';
}
async function loadEmails(cni) {
  $('#emails').innerHTML = '<div class="empty"><span class="spin"></span></div>';
  try { $('#emails').innerHTML = emailsHtml((await api('details', { cni, emails: true })).details.emails || []); }
  catch (e) { $('#emails').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }
}
function linkify(t) {
  return esc(t).replace(/(?:\+?1[\s.-]?)?\(?\d{3}\)?[\s.-]?\d{3}[\s.-]?\d{4}/g, p => '<a href="tel:' + p.replace(/[^\d+]/g, '') + '">' + p + '</a>');
}

// ── Updates to Teams ──────────────────────────────────────────────────────
async function sendUpdate(cni, kind) {
  let text = '';
  if (kind === 'note' || kind === 'late' || kind === 'parts') {
    text = prompt(kind === 'note' ? 'Message for dispatch:' : kind === 'late' ? 'How late / new ETA? (optional)' : 'Which part? (optional)') ;
    if (text === null) return;
    if (kind === 'note' && !text.trim()) return;
  }
  try { const j = await api('update', { cni, kind, text }); toast('Sent to ' + j.sentTo); }
  catch (e) { toast(e.message, 4000); }
}

// ── Closure form ──────────────────────────────────────────────────────────
let schema = store.get('rw_schema', null);
async function openClosure(cni) {
  const j = jobs.find(x => x.cni === cni) || { cni };
  sheet('Close CNI ' + esc(cni), '<div id="cf"><div class="empty"><span class="spin"></span> Loading form…</div></div>');
  try { const s = (await api('schema')).schema; schema = s; store.set('rw_schema', s); }
  catch (e) { if (!schema) { $('#cf').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; return; } }
  fixSchema(schema);
  const yes = v => /^(yes|y|true|successful)$/i.test(String(v || '').trim());
  const draft = store.get('rw_close_' + cni, {});
  const field = f => {
    if (f.kind === 'auto' || f.kind === 'auto-email' || f.kind === 'skip' || f.kind === 'cne') return '';
    if (f.kind === 'files') return '<label class="f" data-col="' + f.col + '"><span>' + esc(f.label) + '</span>' +
      '<input class="in" type="file" id="f_' + f.key + '" accept="image/*" multiple onchange="showPicks(this)"><div class="small" id="picks"></div></label>';
    const id = 'f_' + f.key, req = f.required ? ' <i>*</i>' : '';
    let val = draft[f.key] ?? (f.kind === 'cni' ? cni + (j.wo ? ' / ' + j.wo : '') : f.kind === 'cne' ? (j.wo || '') : f.kind === 'agent' ? session.user.name : f.kind === 'date' ? todayISO() : '');
    let input;
    if (f.kind === 'choice') {
      input = '<div class="seg" data-key="' + f.key + '">' + f.choices.map(c => '<button type="button" class="' + (val === c ? 'on' : '') + '" onclick="segPick(this)">' + esc(c) + '</button>').join('') + '</div>' +
              '<input type="hidden" id="' + id + '" value="' + esc(val) + '">';
    } else if (f.kind === 'long') input = '<textarea class="in" id="' + id + '">' + esc(val) + '</textarea>';
    else {
      const type = f.kind === 'date' ? 'date' : f.kind === 'time' ? 'time' : f.kind === 'datetime' ? 'datetime-local' : f.kind === 'number' ? 'number' : 'text';
      input = '<input class="in" type="' + type + '" id="' + id + '" value="' + esc(val) + '">';
    }
    const isFail = f.onlyIfFailed || f.col === schema.failCol;
    return '<label class="f" data-col="' + f.col + '"' + (isFail ? ' data-fail="1"' : '') + '><span>' + esc(f.label) + req + '</span>' + input + '</label>';
  };
  $('#cf').innerHTML = '<div class="card" style="margin-bottom:12px"><b>' + esc(j.company || '') + '</b><div class="meta">' + esc(j.address || '') + '</div></div>' +
    schema.fields.map(field).join('') +
    '<button class="act primary wide" style="width:100%" id="cf-send" onclick="submitClosure(\'' + cni + '\')">Submit closure</button>' +
    '<div class="small" style="text-align:center;margin-top:8px">Goes into the same closure form sheet as the Google Form.</div>';
  // Questions for unsuccessful visits only show once "No" is picked
  const syncFail = () => {
    const v = $('#f_c' + schema.successCol) ? $('#f_c' + schema.successCol).value : '';
    document.querySelectorAll('#cf [data-fail]').forEach(w => w.classList.toggle('hidden', !v || yes(v)));
  };
  segPick.after = () => { syncFail(); saveDraft(cni); };
  $('#cf').addEventListener('input', () => saveDraft(cni));
  syncFail();
}
// Same rules as the relay, so the form is right even before the relay is redeployed
function fixSchema(sc) {
  sc.fields.forEach(f => {
    const l = String(f.label || '').trim();
    if (!l || /^column \d+$/i.test(l) || l === 'Move' || l === 'Move back') f.kind = 'skip';
    else if (/picture|photo|file|image|upload/i.test(l) && f.kind !== 'auto') f.kind = 'files';
    else if (f.col !== 1 && /^\s*(?:cne|wo|work ?order)\s*(?:#|no\.?|number)?\s*$/i.test(l)) f.kind = 'cne';
    if (f.kind === 'agent') f.kind = 'text';
    if (f.col > sc.successCol && f.col <= 13) f.onlyIfFailed = true;
    f.required = !f.onlyIfFailed && !['auto', 'auto-email', 'skip', 'files', 'cne'].includes(f.kind);
  });
  return sc;
}
function segPick(btn) {
  const seg = btn.parentElement;
  seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === btn));
  $('#f_' + seg.dataset.key).value = btn.textContent;
  if (segPick.after) segPick.after();
}
function closureValues() {
  const v = {};
  schema.fields.forEach(f => { if (f.kind === 'files') return; const el = $('#f_' + f.key); if (el && !el.closest('.hidden')) v[f.key] = el.value; });
  return v;
}
function showPicks(inp) { $('#picks').textContent = inp.files.length ? inp.files.length + ' photo' + (inp.files.length === 1 ? '' : 's') + ' selected' : ''; }
// Photos are shrunk on the phone (max 1600 px, JPEG) before upload
function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve({ name: file.name.replace(/\.\w+$/, '') + '.jpg', data: c.toDataURL('image/jpeg', 0.8) });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read ' + file.name)); };
    img.src = url;
  });
}
async function closureFiles() {
  const f = schema.fields.find(x => x.kind === 'files');
  const el = f && $('#f_' + f.key);
  if (!el || !el.files.length) return [];
  return Promise.all([...el.files].slice(0, 10).map(shrink));
}
function saveDraft(cni) { store.set('rw_close_' + cni, closureValues()); }
async function submitClosure(cni) {
  const v = closureValues();
  const missing = schema.fields.filter(f => f.required && !['auto', 'auto-email'].includes(f.kind) && !String(v[f.key] || '').trim());
  if (missing.length) { toast('Missing: ' + missing.map(f => f.label).join(', '), 4000); return; }
  if (!confirm('Submit the closure for CNI ' + cni + '?')) return;
  const b = $('#cf-send'); b.disabled = true; b.innerHTML = '<span class="spin"></span> Sending…';
  try {
    const files = await closureFiles();
    if (files.length) b.innerHTML = '<span class="spin"></span> Uploading ' + files.length + ' photo' + (files.length === 1 ? '' : 's') + '…';
    await api('close', { cni, values: v, files });
    store.del('rw_close_' + cni);
    toast('Closure submitted ✓', 3500);
    closeSheet(); history.back();
    jobs = jobs.filter(x => x.cni !== cni); render();
  } catch (e) { toast(e.message, 5000); b.disabled = false; b.textContent = 'Submit closure'; }
}

// ── Parts (FedEx) ─────────────────────────────────────────────────────────
async function loadParts() {
  if (!session) return;
  const el = $('#view-parts');
  if (parts === null) el.innerHTML = '<div class="empty"><span class="spin"></span> Checking FedEx…</div>';
  try { parts = (await api('parts', { tech: techFilter })).parts; store.set('rw_parts_' + session.user.name, parts); }
  catch (e) { parts = parts || store.get('rw_parts_' + session.user.name, []); if (!offline) toast(e.message, 4000); }
  renderParts();
}
function renderParts() {
  const el = $('#view-parts');
  if (parts === null) return;
  const waiting = parts.filter(p => p.fedex && p.fedex.held && !p.fedex.delivered).length;
  $('#parts-badge').innerHTML = waiting ? '<span class="badge">' + waiting + '</span>' : '';
  if (!parts.length) { el.innerHTML = '<div class="empty">No parts on the map</div>'; return; }
  const admin = session.user.admin && techFilter === 'ALL';
  const done = p => (p.fedex && p.fedex.delivered && p.fedex.ours) || p.markedPickedUp;
  const left = p => p.fedex && p.fedex.daysLeft != null ? p.fedex.daysLeft : 99;
  const open = parts.filter(p => !done(p)).sort((a, b) => left(a) - left(b)), gone = parts.filter(done);
  const card = p => {
    const f = p.fedex;
    const st = !f ? '<span class="chip">No FedEx status</span>'
      : f.delivered && f.ours ? '<span class="chip green">Picked up' + (f.receivedBy ? ' by ' + esc(f.receivedBy) : '') + '</span>'
      : f.delivered ? '<span class="chip red">⚠ Picked up by ' + esc(f.receivedBy || 'unknown') + '</span>'
      : f.held ? '<span class="chip amber">Ready for pickup</span>'
      : '<span class="chip blue">' + esc(f.status) + '</span>';
    return '<div class="card">' +
      '<div class="row between"><b>' + esc(p.tracking) + '</b>' + st + '</div>' +
      '<div class="meta">' + esc(p.pickupName || '') + (p.pickup ? ' · ' + esc(p.pickup) : '') + '</div>' +
      '<div class="small">CNI ' + esc(p.cni) + (p.company ? ' · ' + esc(p.company) : '') + (admin ? ' · <b>' + esc(p.tech) + '</b>' : '') +
        (f && (f.where || f.at) ? ' · ' + esc([f.where, f.at].filter(Boolean).join(' · ')) : '') + '</div>' +
      (f && f.daysLeft != null && !done(p) ? '<div style="margin-top:6px">' + returnChip(f) +
        ' <a href="#" class="small" onclick="event.preventDefault();extendHold(\'' + p.tracking + '\',\'' + p.cni + '\')">Extended?</a></div>' : '') +
      (done(p) ? '<div class="act" style="display:block;margin-top:8px;color:var(--green)">Picked up ✅</div>'
      : '<div class="actions" style="margin-top:8px;grid-template-columns:1fr 1fr">' +
        (p.pickup ? '<a class="act" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(p.pickup) + '">▶ Navigate</a>' : '<span></span>') +
        '<button class="act" onclick="pickedUp(\'' + p.tracking + '\',\'' + p.cni + '\',this)">✓ I picked it up</button>' +
      '</div>') + '</div>';
  };
  el.innerHTML = (open.length ? '<div class="group">To pick up · ' + open.length + '</div>' + open.map(card).join('') : '<div class="empty">Nothing waiting to be picked up</div>') +
    (gone.length ? '<div class="group" style="cursor:pointer" onclick="partsShowDone=!partsShowDone;renderParts()">' + (partsShowDone ? '▾' : '▸') +
      ' Picked up · ' + gone.length + '</div>' + (partsShowDone ? gone.map(card).join('') : '') : '');
}
let partsShowDone = false;
function partChip(f) {
  if (!f) return '<span class="chip">No FedEx status</span>';
  if (f.delivered) return '<span class="chip red">⚠ Picked up by ' + esc(f.receivedBy || 'unknown') + '</span>';
  if (f.held) return f.daysLeft != null ? returnChip(f) : '<span class="chip amber">Ready for pickup</span>';
  return '<span class="chip blue">' + esc(f.status) + '</span>';
}
function returnChip(f) {
  const d = f.daysLeft;
  const cls = d <= 1 ? 'red' : d <= 2 ? 'amber' : 'green';
  const txt = d < 0 ? 'Past return date (' + f.returnBy + ')' : d === 0 ? 'Goes back today' : d + ' day' + (d === 1 ? '' : 's') + ' left · back ' + f.returnBy;
  return '<span class="chip ' + cls + '">⏳ ' + esc(txt) + (f.extended ? ' · extended +' + f.extended : '') + '</span>';
}
async function extendHold(tracking, cni) {
  const d = prompt('FedEx extended the hold by how many days?', '5');
  if (d === null) return;
  try { await api('extend', { tracking, cni, days: Number(d) }); toast('Hold extended +' + d + ' days'); parts = null; loadParts(); }
  catch (e) { toast(e.message, 4000); }
}
async function pickedUp(tracking, cni, btn) {
  if (!confirm('Mark part ' + tracking + ' as picked up?')) return;
  btn.disabled = true;
  try { await api('pickedup', { tracking, cni }); toast('Marked picked up'); const p = parts.find(x => x.tracking === tracking); if (p) p.markedPickedUp = true; renderParts(); }
  catch (e) { btn.disabled = false; toast(e.message, 4000); }
}

// ── Theme ─────────────────────────────────────────────────────────────────
function toggleTheme() {
  const light = document.documentElement.dataset.theme !== 'light';
  document.documentElement.dataset.theme = light ? 'light' : 'dark';
  store.set('rw_theme', light ? 'light' : 'dark');
  if (map) map.setOptions({ styles: light ? [] : DARK });
}
document.documentElement.dataset.theme = store.get('rw_theme', 'dark');
const DARK = [
  { elementType: 'geometry', stylers: [{ color: '#1d1d2a' }] }, { elementType: 'labels.text.fill', stylers: [{ color: '#8a8aa0' }] },
  { elementType: 'labels.text.stroke', stylers: [{ color: '#1d1d2a' }] }, { featureType: 'road', elementType: 'geometry', stylers: [{ color: '#2c2c40' }] },
  { featureType: 'road.highway', elementType: 'geometry', stylers: [{ color: '#3c3c56' }] }, { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#0e1622' }] },
  { featureType: 'poi', stylers: [{ visibility: 'off' }] }, { featureType: 'transit', stylers: [{ visibility: 'off' }] },
];

// ── Boot ──────────────────────────────────────────────────────────────────
window.addEventListener('online', () => refresh());
document.addEventListener('visibilitychange', () => { if (!document.hidden && lastAt && Date.now() - Date.parse(lastAt) > 60e3) refresh(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (session && session.user) start();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12121a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rewind">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Rewind Jobs</title>
<style>
  :root {
    --bg: #12121a; --panel: #1a1a26; --panel2: #222232; --line: #2c2c40;
    --text: #f2f2f6; --sub: #a0a0b4; --dim: #6c6c82;
    --accent: #d8a86a; --green: #4fb37f; --blue: #6aa4e0; --red: #e06a6a; --amber: #e8a83a;
    --radius: 12px; color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f3f2ee; --panel: #ffffff; --panel2: #f0efea; --line: #dddcd4;
    --text: #1b1b22; --sub: #5d5d6b; --dim: #9a9aa6;
    --accent: #a8742e; --green: #23875a; --blue: #2f6db0; --red: #c03f3f; --amber: #b0761a; color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text);
         display: flex; flex-direction: column; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: var(--blue); }
  .hidden { display: none !important; }

  /* Top bar */
  header { display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
           background: var(--panel); border-bottom: 1px solid var(--line); flex-shrink: 0; }
  header .brand { font-weight: 800; letter-spacing: .02em; }
  header .who { font-size: 12px; color: var(--sub); }
  header .grow { flex: 1; min-width: 0; }
  header { flex-wrap: wrap; }
  header select { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13px;
                  order: 10; flex: 1 1 100%; }
  .icon-btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 14px; line-height: 1; }
  #stamp { font-size: 11px; color: var(--dim); padding: 4px 16px; background: var(--bg); flex-shrink: 0; }
  #stamp.offline { color: var(--amber); }

  /* Views */
  main { flex: 1; min-height: 0; position: relative; }
  .view { position: absolute; inset: 0; overflow-y: auto; padding: 8px 12px 16px; }
  #view-map { padding: 0; overflow: hidden; }
  #map { width: 100%; height: 100%; background: var(--panel2); }
  .map-legend { background: rgba(20,20,30,.88); color: #eee; font: 11px/1.5 system-ui, sans-serif; padding: 6px 9px; border-radius: 9px; margin: 0 0 22px 8px; max-width: 220px; }
  .map-legend b { cursor: pointer; display: block; }
  .map-legend.shut div { display: none; }
  .map-legend div { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 3px; }
  .map-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  .map-legend i.tag { border-radius: 3px; width: 14px; height: 9px; border: 1px solid #fff; }
  @media (min-width: 900px) {
    main.split #view-jobs, main.split #view-today { right: 50%; }
    main.split #view-map { left: 50%; display: block !important; border-left: 1px solid var(--line); }
  }

  /* Bottom tabs */
  nav { display: flex; background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); flex-shrink: 0; }
  nav button { flex: 1; background: none; border: none; padding: 9px 4px 8px; font-size: 11px; color: var(--sub); display: flex; flex-direction: column; align-items: center; gap: 2px; }
  nav button b { font-size: 19px; line-height: 1; font-weight: 400; }
  nav button.on { color: var(--accent); }
  #bell-badge .badge { position: absolute; top: -6px; right: -6px; margin: 0; }
  .notif { cursor: pointer; }
  .notif.unread { border-left: 3px solid var(--accent); }
  .notif .t { font-weight: 700; font-size: 14px; }
  .notif:not(.unread) .t { font-weight: 500; color: var(--sub); }
  nav .badge { background: var(--red); color: #fff; border-radius: 9px; font-size: 10px; padding: 0 5px; margin-left: 3px; }

  /* Lists */
  .group { font-size: 12px; font-weight: 700; color: var(--dim); text-transform: uppercase; letter-spacing: .07em; margin: 14px 4px 6px; }
  .group:first-child { margin-top: 6px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; }
  .job { cursor: pointer; }
  .job:active { background: var(--panel2); }
  .row { display: flex; align-items: center; gap: 8px; }
  .between { justify-content: space-between; }
  .co { font-weight: 700; }
  .meta { font-size: 13px; color: var(--sub); }
  .small { font-size: 12px; color: var(--dim); }
  .chip { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--panel2); color: var(--sub); white-space: nowrap; }
  .chip.green { color: var(--green); } .chip.amber { color: var(--amber); } .chip.red { color: var(--red); } .chip.blue { color: var(--blue); }
  .empty { text-align: center; color: var(--dim); padding: 40px 16px; }
  .search { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; margin: 4px 0 6px; }

  /* Sheets (details, closure) */
  .sheet { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; }
  .sheet-head { display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .sheet-head .t { flex: 1; font-weight: 800; }
  .sheet-body { flex: 1; overflow-y: auto; padding: 12px 12px calc(24px + env(safe-area-inset-bottom)); }
  .sec { margin-top: 14px; }
  .sec h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--dim); margin: 0 4px 6px; }
  .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .act { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 6px; text-align: center; font-size: 13px; font-weight: 600; text-decoration: none; color: var(--text); }
  .act:active { background: var(--panel2); }
  .act.primary { background: var(--accent); color: #1b1408; border-color: var(--accent); }
  .act.on { border-color: var(--accent); color: var(--accent); }
  .sheet-foot { display: grid; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid var(--line); }
  .note-row { display: flex; gap: 8px; align-items: flex-end; margin-top: 6px; }
  .note-row textarea#note-text { flex: 1; min-height: 42px; height: 42px; resize: none; overflow: hidden; padding-top: 10px; padding-bottom: 10px; }
  .note-row .act { padding: 11px 16px; }
  .loc { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); margin-bottom: 10px; overflow: hidden; }
  .loc-head { padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel2); }
  .loc-head .co { font-size: 15px; }
  .loc-part { padding: 10px 14px; border-top: 1px solid var(--line); }
  .loc-part:first-of-type { border-top: none; }
  #menu-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
  #menu { background: var(--panel); border-radius: 16px 16px 0 0; width: 100%; max-width: 560px; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); }
  #menu .mt { font-size: 13px; color: var(--sub); margin: 0 4px 10px; }
  #menu .actions { grid-template-columns: 1fr 1fr; }
  #menu .act { padding: 14px 8px; font-size: 15px; }
  .act .sub { display: block; font-size: 11px; font-weight: 500; color: var(--sub); margin-top: 2px; }
  .partbox { border: 2px solid var(--accent); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 8px; background: var(--panel); }
  .partbox .lbl { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
  .partbox .trk { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 15px; color: var(--sub); margin-top: 2px; }
  .partbox .trk b { font-size: 26px; color: var(--accent); letter-spacing: .04em; }
  .partbox .pn { font-size: 15px; font-weight: 600; margin-top: 2px; word-break: break-word; }
  .egg { display: inline-block; margin-left: 4px; font-size: .8em; animation: egg 1.6s ease-in-out infinite; cursor: default; }
  @keyframes egg { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-14deg) scale(1.15); } 40% { transform: rotate(10deg); } 60% { transform: rotate(0); } }
  .last4 { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 800; color: var(--accent); }
  .act:disabled { opacity: .45; }
  .act.wide { grid-column: span 3; padding: 13px; font-size: 15px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 13px; }
  .kv dt { color: var(--dim); } .kv dd { word-break: break-word; }
  .pre { white-space: pre-wrap; font-size: 13px; }
  .feed .item { border-left: 2px solid var(--line); padding: 2px 0 8px 10px; }
  .feed .item .h { font-size: 12px; color: var(--dim); }
  .feed .item.hem { border-left-color: var(--amber); }

  /* Forms */
  label.f { display: block; margin-bottom: 12px; }
  label.f span { display: block; font-size: 13px; color: var(--sub); margin-bottom: 4px; }
  label.f span i { color: var(--red); font-style: normal; }
  input.in, select.in, textarea.in { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; }
  textarea.in { min-height: 90px; resize: vertical; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 8px 12px; font-size: 14px; }
  .seg button.on { border-color: var(--accent); color: var(--accent); font-weight: 700; }

  /* Login */
  #login { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 24px; }
  #login .box { width: 100%; max-width: 320px; text-align: center; }
  #login h1 { font-size: 22px; margin-bottom: 4px; }
  #login p { color: var(--sub); font-size: 14px; margin-bottom: 20px; }
  #code { width: 100%; text-align: center; font-size: 26px; letter-spacing: .35em; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  #login .err { color: var(--red); min-height: 20px; margin-top: 10px; font-size: 14px; }

  /* Toast */
  #toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 200;
           background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: 90vw; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
  body.trainee #nav-admin, body.trainee .sheet-foot { display: none !important; }
  #flash { position: fixed; inset: 0; z-index: 210; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  #flash .box { background: rgba(20,20,30,.94); color: #fff; border-radius: 18px; padding: 22px 28px; text-align: center; min-width: 180px;
                box-shadow: 0 8px 30px rgba(0,0,0,.4); animation: flashIn .18s ease-out; transition: opacity .35s, transform .35s; }
  #flash .box.out { opacity: 0; transform: scale(.94); }
  #flash .ic { font-size: 40px; line-height: 1; }
  #flash .t { font-size: 17px; font-weight: 700; margin-top: 8px; }
  #flash .s { font-size: 13px; color: #bbb; margin-top: 3px; }
  @keyframes flashIn { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: scale(1); } }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s .8s linear infinite; vertical-align: -2px; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h1>Rewind Repair</h1>
    <p>Enter your 6-digit code</p>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="••••••">
    <button class="act primary wide" style="width:100%;margin-top:12px" onclick="login()">Sign in</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<header>
  <div class="grow">
    <div class="brand">Rewind Jobs</div>
    <div class="who" id="who"></div>
  </div>
  <select id="tech-pick" class="hidden" onchange="pickTech(this.value)"></select>
  <button class="icon-btn" onclick="openNotifs()" title="Notifications" style="position:relative">🔔<span id="bell-badge"></span></button>
  <button class="icon-btn" onclick="refresh(true)" title="Refresh">↻</button>
  <button class="icon-btn" onclick="toggleTheme()" title="Light / dark" id="theme-btn">◐</button>
  <button class="icon-btn" onclick="sure('Sign out?','Sign out').then(y=>{if(y)logout()})" title="Sign out" style="font-size:12px">Sign out</button>
</header>
<div id="stamp"></div>

<main id="main" class="split">
  <section class="view" id="view-today"></section>
  <section class="view hidden" id="view-jobs"></section>
  <section class="view hidden" id="view-map"><div id="map"></div></section>
  <section class="view hidden" id="view-parts"></section>
  <section class="view hidden" id="view-pay"></section>
  <section class="view hidden" id="view-admin"></section>
</main>

<nav>
  <button data-v="today" class="on" onclick="show('today')"><b>◷</b>Today</button>
  <button data-v="jobs" onclick="show('jobs')"><b>☰</b>Jobs</button>
  <button data-v="map" onclick="show('map')"><b>⌖</b>Map</button>
  <button data-v="parts" onclick="show('parts')"><b>▣</b><span>Parts<span id="parts-badge"></span></span></button>
  <button data-v="pay" id="nav-pay" class="hidden" onclick="show('pay')"><b>$</b>Pay</button>
  <button data-v="admin" id="nav-admin" class="hidden" onclick="show('admin')"><b>▤</b>Admin</button>
</nav>

<div id="toast"></div>

<script>
// ── Config ────────────────────────────────────────────────────────────────
// Nord Claude's relay (Apps Script web app). Codes are checked there, never in this page.
const API = 'https://script.google.com/macros/s/AKfycbwBvMfaJCj-UDoE-Oa9jEcIYxy4XIT2v9hFHJ-kqkEHOs8afDBxL9KZiufacb1gVsATlQ/exec';
const MAPS_KEY = 'AIzaSyBvtDmQkxaYjYffIyJYYH7I0waSvuKF3Eg';
const AUTO_REFRESH_MIN = 5;
const APP_VERSION = '3.60';
const VAPID_PUBLIC = 'BP2C2HFEMyUFpKCzr7F5zXXF8RI12OnaS-eZohOoQmsoIXI3K9mclMpeti1Ey6-SpcI04Lp-SSR6rOHt0be9Q3E';   // phone notifications (the private half lives in the rewind-push worker)

// ── Small helpers ─────────────────────────────────────────────────────────
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
function toast(msg, ms) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), ms || 2600);
}
// Big centred confirmation that fades out on its own ("✅ Message sent")
function flash(title, sub, icon) {
  let f = $('#flash');
  if (!f) { f = document.createElement('div'); f.id = 'flash'; document.body.appendChild(f); }
  f.innerHTML = '<div class="box"><div class="ic">' + (icon || '✅') + '</div><div class="t">' + esc(title) + '</div>' + (sub ? '<div class="s">' + esc(sub) + '</div>' : '') + '</div>';
  try { navigator.vibrate && navigator.vibrate(40); } catch (e) {}
  clearTimeout(flash.t1); clearTimeout(flash.t2);
  flash.t1 = setTimeout(() => { const b = f.querySelector('.box'); if (b) b.classList.add('out'); }, 1600);
  flash.t2 = setTimeout(() => { f.innerHTML = ''; }, 2000);
}
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const nice = iso => new Date(iso + 'T12:00').toLocaleDateString([], { weekday: 'short', month: 'numeric', day: 'numeric' });
// Phone numbers: "+1…", "(303) …", "303-555-…" anywhere; a bare 10-digit run only after a phone label
// (CNE / WO numbers are 10 digits too)
function phonesIn(text) {
  const t = String(text || ''), out = [];
  const re = /(\+?1[\s.-]?)?(\(?\d{3}\)?)([\s.-]?)(\d{3})([\s.-]?)(\d{4})(?!\d)/g;
  let m;
  while ((m = re.exec(t))) {
    if (m.index > 0 && /\d/.test(t[m.index - 1])) continue;
    const formatted = (m[1] && m[1].includes('+')) || /[()]/.test(m[2]) || m[3] || m[5];
    const labelled = /(phone|tel|mobile|cell|contact|call|ph|☎|📞)[^\n\d]{0,20}$/i.test(t.slice(Math.max(0, m.index - 30), m.index));
    if (!formatted && !labelled) continue;
    const d = m[0].replace(/\D/g, '').replace(/^1(?=\d{10}$)/, '');
    if (d.length === 10 && !out.includes(d)) out.push(d);
  }
  return out.map(d => '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6));
}
const shortDate = s => { const t = Date.parse(s); return isNaN(t) ? '' : new Date(t).toLocaleDateString([], { month: 'numeric', day: 'numeric' }); };
const navUrl = j => j.lat ? 'https://www.google.com/maps/dir/?api=1&destination=' + j.lat + ',' + j.lng
                          : 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(j.address || j.loc || j.city);

// ── API ───────────────────────────────────────────────────────────────────
let session = store.get('rw_session', null);   // { pin, user, techs }
async function api(op, extra) {
  let res, j;
  try {
    res = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ action: 'app', op }, extra || {}, { pin: session && session.pin })) });
    j = await res.json();
  } catch (e) { throw Object.assign(new Error(navigator.onLine ? 'Could not reach the server' : 'No signal'), { offline: true }); }
  if (j.auth) { logout(); throw new Error(j.error || 'Signed out'); }
  if (!j.ok) throw new Error(j.error || 'Something went wrong');
  return j;
}

// ── Login ─────────────────────────────────────────────────────────────────
async function login() {
  const pin = $('#code').value.trim();
  if (!pin) return;
  $('#login-err').innerHTML = '<span class="spin"></span>';
  session = { pin };
  try {
    const j = await api('login');
    session = { pin, user: j.user, techs: j.techs || [] };
    store.set('rw_session', session);
    start();
  } catch (e) { session = null; $('#login-err').textContent = e.message; }
}
function logout() {
  store.del('rw_session'); session = null;
  $('#login').classList.remove('hidden'); $('#code').value = '';
}
$('#code').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

// ── State ─────────────────────────────────────────────────────────────────
let jobs = [], parts = null, view = 'today', techFilter = 'ALL', search = '';
let lastAt = null, offline = false;

// Admin tech picker, A→Z by name, Owners last
function fillTechs() {
  const sel = $('#tech-pick');
  session.techs.sort((a, b) => (a.tech === 'OWN') - (b.tech === 'OWN') || String(a.name).localeCompare(b.name));
  sel.innerHTML = '<option value="ALL">All techs</option>' + session.techs.map(t =>
    '<option value="' + esc(t.tech) + '">' + esc(t.name) + (t.area ? ' · ' + esc(t.area) : '') + '</option>').join('');
  sel.value = session.techs.some(t => t.tech === techFilter) ? techFilter : 'ALL';
}
function start() {
  $('#login').classList.add('hidden');
  const u = session.user;
  $('#who').textContent = u.name + (u.admin ? ' · admin' : u.trainee ? ' · shadowing' : '');
  const sel = $('#tech-pick');
  if (u.admin) {
    techFilter = store.get('rw_tech', 'ALL');
    fillTechs();
    sel.classList.remove('hidden');
    // the list is saved at login; refresh it so new techs show without logging out
    api('login').then(j => {
      if (!j.techs || !j.techs.length) return;
      session.techs = j.techs; store.set('rw_session', session); fillTechs();
    }).catch(() => {});
  } else sel.classList.add('hidden');
  $('#nav-pay').classList.toggle('hidden', !!u.admin && (!u.tech || u.tech === 'ADMIN'));   // a tech who's also admin keeps My pay
  document.body.classList.toggle('trainee', !!u.trainee);
  $('#nav-admin').classList.toggle('hidden', !u.admin);
  flushQueue();
  const cached = store.get('rw_jobs_' + u.name + '_' + techFilter, null);
  if (cached) { jobs = cached.jobs; lastAt = cached.at; render(); }
  refresh();
  openFromLink();
  if (pushSupported() && Notification.permission === 'granted') enablePush(true);   // keep the subscription fresh
  clearInterval(start.t); start.t = setInterval(() => { if (!document.hidden) refresh(); }, AUTO_REFRESH_MIN * 60e3);
}

    closeMenu();

    bg.id = 'menu-bg';
    const done = v => { bg.remove(); res(v); };
    const field = o.input === false ? '' : o.number
      ? '<input class="in" id="ask-t" type="number" inputmode="numeric" value="' + esc(o.value || '') + '">'
      : '<textarea class="in" id="ask-t" style="min-height:70px" placeholder="' + esc(o.placeholder || '') + '">' + esc(o.value || '') + '</textarea>';
    bg.innerHTML = '<div id="menu"><div class="mt">' + title + '</div>' + field +
      (o.check ? '<label class="row" style="gap:10px;margin:10px 2px 0"><input type="checkbox" id="ask-c"' + (o.checked === false ? '' : ' checked') + '> <span>' + o.check + '</span></label>' : '') +
      '<div class="actions" style="margin-top:12px"><button class="act" id="ask-no">Cancel</button><button class="act primary" id="ask-ok">' + (o.ok || 'OK') + '</button></div></div>';
    document.body.appendChild(bg);
    bg.onclick = e => { if (e.target === bg) done(null); };
    $('#ask-no').onclick = () => done(null);
    $('#ask-ok').onclick = () => {
      const t = $('#ask-t'), v = t ? t.value : true;
      if (o.required && !String(v).trim()) { toast(o.required); return; }
      done(o.check ? { text: t ? v : '', check: $('#ask-c').checked } : v);
    };
    setTimeout(() => { const t = $('#ask-t'); if (t) t.focus(); }, 60);
  });
}

  // Two passes so a question that depends on another hidden one hides too

function fixSchema(sc) {

    if (!l || /^column \d+$/i.test(l) || l === 'Move' || l === 'Move back') f.kind = 'skip';
    else if (/picture|photo|file|image|upload/i.test(l) && f.kind !== 'auto') f.kind = 'files';
    else if (f.col !== 1 && /^\s*(?:cne|wo|work ?order)\s*(?:#|no\.?|number)?\s*$/i.test(l)) f.kind = 'cne';
    if (f.kind === 'agent') f.kind = 'text';

// Photos are shrunk on the phone (max 1600 px, JPEG) before upload
function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve({ name: file.name.replace(/\.\w+$/, '') + '.jpg', data: c.toDataURL('image/jpeg', 0.8) });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read ' + file.name)); };
    img.src = url;
  });
}

// ── Offline queue ─────────────────────────────────────────────────────────
// Contact attempts, Teams updates, visit times, notes and closures made with no signal are kept
// on the phone (IndexedDB) and sent, in order, as soon as it's back online.
const QUEUE_OPS = ['contact', 'update', 'visit', 'note', 'close', 'issue', 'nsaclose'];
const idb = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('rewind-jobs', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('outbox', { keyPath: 'id', autoIncrement: true });
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async tx(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('outbox', mode), st = t.objectStore('outbox');
      const out = fn(st);
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
      t.onerror = () => rej(t.error);
    });
  },
  add(item) { return this.tx('readwrite', st => st.add(item)); },
  all() { return this.tx('readonly', st => st.getAll()); },
  del(id) { return this.tx('readwrite', st => st.delete(id)); },
};
let queued = 0;
async function countQueue() { try { queued = (await idb.all()).length; } catch (e) { queued = 0; } stamp(); }
// Like api(), but a request that can't reach the relay is kept and sent later
async function send(op, extra, label) {
  try { return await api(op, extra); }
  catch (e) {
    if (!e.offline || !QUEUE_OPS.includes(op)) throw e;
    await idb.add({ op, extra, label: label || op, at: new Date().toISOString(), user: session.user.name });
    await countQueue();
    toast('📴 No signal — saved, will send when you\'re back online', 4000);
    return { ok: true, queued: true };
  }
}
let flushing = false;
async function flushQueue() {
  if (flushing || !session || !navigator.onLine) return;
  flushing = true;
  try {
    const items = (await idb.all()).filter(i => i.user === session.user.name).sort((a, b) => a.id - b.id);
    let sent = 0;
    for (const it of items) {
      try { await api(it.op, it.extra); sent++; await idb.del(it.id); }
      catch (e) {
        if (e.offline) break;                                   // still no signal: try again later
        await idb.del(it.id);
        toast('Could not send saved ' + it.label + ': ' + e.message, 6000);
      }
    }
    if (sent) toast('📶 Sent ' + sent + ' saved item' + (sent === 1 ? '' : 's'), 3500);
  } catch (e) { /* IndexedDB unavailable */ }
  flushing = false;
  countQueue();
}
window.addEventListener('online', () => setTimeout(flushQueue, 1500));

// ── Barcode scanner (serial / tracking) ───────────────────────────────────
// BarcodeDetector where the phone has it (Android Chrome); otherwise ZXing from a CDN.
let scanStop = null;
// A FedEx tracking number from whatever barcode was read, or '' if it isn't one:
//  • 12 / 15 digits: the tracking number itself
//  • 34 digits (Express 1D barcode): the last 12
//  • 22 digits starting 96 (Ground "96" barcode): the last 15
//  • PDF417 / 2D (the big square): fields split by GS; the tracking number is a 12- or 15-digit field
function fedexTracking(raw) {
  const s = String(raw || '');
  const d = s.replace(/\D/g, '');
  if (/^\d+$/.test(s.trim())) {
    if (d.length === 12 || d.length === 15) return d;
    if (d.length === 34 || d.length === 32 || d.length === 33) return d.slice(-12);
    if (d.length === 22 && d.startsWith('96')) return d.slice(-15);
    if (d.length === 20 || d.length === 21) return d.slice(-12);
    return '';
  }

// Daily board: each tech's stops for one day, in route order, on one map
const BOARD_HEAVY = 5;                       // this many stops in a day or more → flagged heavy
let boardDay = todayISO(), boardMap = null, boardShapes = [];
function waitForMaps(ms) {
  return new Promise(res => { const t0 = Date.now(); (function poll() { if (window.google && google.maps) return res(true); if (Date.now() - t0 > ms) return res(false); setTimeout(poll, 200); })(); });
}
async function renderBoard() {
  const box = $('#admin-body');
  box.innerHTML = '<div class="row between" style="margin:0 4px 8px;gap:8px"><button class="act" style="padding:8px 14px" onclick="boardDay=addDays(boardDay,-1);renderBoard()">←</button>' +
    '<b style="flex:1;text-align:center">' + (boardDay === todayISO() ? 'Today · ' : '') + esc(nice(boardDay)) + '</b>' +
    '<button class="act" style="padding:8px 14px" onclick="boardDay=addDays(boardDay,1);renderBoard()">→</button></div>' +
    '<div id="board-map" style="height:280px;border-radius:12px;margin:0 4px 10px;background:var(--panel2)"></div><div id="board"><div class="empty"><span class="spin"></span></div></div>';
  let all;
  try { all = techFilter === 'ALL' ? jobs : (await api('jobs', { tech: 'ALL' })).jobs; }
  catch (e) { $('#board').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; return; }
  const techs = session.techs.filter(t => t.tech !== 'OWN' || all.some(j => j.tech === 'OWN'));
  const cols = techs.map((t, i) => {
    const mine = all.filter(j => j.tech === t.tech);
    const day = mine.filter(j => j.appt && j.appt.date === boardDay);
    const geo = day.filter(j => j.lat), rest = day.filter(j => !j.lat);
    const order = (geo.length > 1 ? orderStops(null, geo) : geo).concat(rest);
    const mi = order.filter(j => j.lat).reduce((s, j, k, a) => s + (k ? miles(a[k - 1], j) : 0), 0);
    return { t, color: TECH_HUES[i % TECH_HUES.length], order, mi, open: mine.length, unsched: mine.filter(j => !j.appt).length };
  });
  const load = c => !c.order.length ? '<span class="chip">Idle</span>' : c.order.length >= BOARD_HEAVY ? '<span class="chip red">Heavy · ' + c.order.length + ' stops</span>'
    : '<span class="chip green">' + c.order.length + ' stop' + (c.order.length === 1 ? '' : 's') + '</span>';
  const total = cols.reduce((s, c) => s + c.order.length, 0);

      cols.filter(c => !c.order.length).length + ' tech' + (cols.filter(c => !c.order.length).length === 1 ? '' : 's') + ' idle</div>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;margin:0 4px">' + cols.map(c =>
      '<div class="card" style="margin:0;border-top:4px solid ' + c.color + (c.order.length >= BOARD_HEAVY ? ';border-color:var(--red)' : '') + '">' +
        '<div class="row between"><span class="co">' + esc(c.t.name) + '</span>' + load(c) + '</div>' +
        '<div class="small" style="margin:2px 0 6px">' + esc(c.t.area || '') + (c.t.area ? ' · ' : '') + c.open + ' open' +
          (c.unsched ? ' · <a href="#" onclick="event.preventDefault();pickTech(\'' + esc(c.t.tech) + '\');$(\'#tech-pick\').value=\'' + esc(c.t.tech) + '\';show(\'today\')">' + c.unsched + ' not scheduled</a>' : '') +
          (c.mi ? ' · ≈ ' + Math.round(c.mi) + ' mi' : '') + '</div>' +
        (c.order.length ? c.order.map((j, k) => '<div class="small" style="padding:5px 0;border-top:1px solid var(--line);cursor:pointer" onclick="openJob(\'' + j.cni + '\')">' +
          '<b>' + (k + 1) + '.</b> ' + (j.appt.time ? '<b>' + esc(j.appt.time) + '</b> · ' : '') + esc(j.company || j.customer || 'CNI ' + j.cni) +
          '<div style="color:var(--sub)">' + esc(j.city || j.address || '') + (j.lat ? '' : ' · no map location') + (j.rpos ? ' · 🚨 RPOS' : '') + '</div></div>').join('')
          : '<div class="small" style="color:var(--sub);padding:4px 0">Nothing booked' + (c.unsched ? ' — ' + c.unsched + ' job' + (c.unsched === 1 ? '' : 's') + ' could go here' : '') + '</div>') +
      '</div>').join('') + '</div>';
  ensureMap();
  if (!(await waitForMaps(10000)) || !$('#board-map')) { if ($('#board-map')) $('#board-map').style.display = 'none'; return; }
  boardMap = new google.maps.Map($('#board-map'), { center: { lat: 39.5, lng: -98.35 }, zoom: 4, streetViewControl: false, mapTypeControl: false,
    fullscreenControl: false, clickableIcons: false, styles: document.documentElement.dataset.theme === 'light' ? [] : DARK });
  mapLegend(boardMap, true);
  const bounds = new google.maps.LatLngBounds(); let n = 0;
  cols.forEach(c => {
    const pts = c.order.filter(j => j.lat);
    if (pts.length > 1) new google.maps.Polyline({ map: boardMap, path: pts.map(j => ({ lat: j.lat, lng: j.lng })), strokeColor: c.color, strokeOpacity: .9, strokeWeight: 3 });
    pts.forEach((j, k) => {
      const m = new google.maps.Marker({ map: boardMap, position: { lat: j.lat, lng: j.lng }, title: c.t.name + ' · ' + (k + 1) + '. ' + (j.company || j.cni) + (j.device ? ' · ' + j.device : ''),
        icon: jobPin(j, c.color, c.t.tech + ' ' + (k + 1)) });
      m.addListener('click', () => openJob(j.cni));
      bounds.extend(m.getPosition()); n++;
    });
  });
  if (n) { boardMap.fitBounds(bounds, 40); if (n === 1) boardMap.setZoom(12); }
}

const WD = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
function guessWhen(text, baseIso) {
  const t = String(text || ''), base = new Date(Date.parse(baseIso) || Date.now());
  const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  let date = '';
  const md = t.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);
  if (md) { const y = md[3] ? (md[3].length === 2 ? 2000 + +md[3] : +md[3]) : base.getFullYear(); const d = new Date(y, +md[1] - 1, +md[2]); if (!md[3] && d < new Date(base.getFullYear(), base.getMonth(), base.getDate() - 7)) d.setFullYear(y + 1); date = iso(d); }
  else if (/\btomorrow\b/i.test(t)) { const d = new Date(base); d.setDate(d.getDate() + 1); date = iso(d); }
  else { const w = t.match(/\b(sun|mon|tue|wed|thu|fri|sat)[a-z]*\b/i);
    if (w) { const want = WD.findIndex(x => x.startsWith(w[1].toLowerCase())); const d = new Date(base); d.setDate(d.getDate() + 1); while (d.getDay() !== want) d.setDate(d.getDate() + 1); date = iso(d); } }
  // an explicit window first ("9-12", "10am to 2pm"), then a single time, then words
  const tm = t.match(/\b\d{1,2}(?::\d\d)?\s*(?:am|pm)?\s*(?:-|–|to)\s*\d{1,2}(?::\d\d)?\s*(?:am|pm)?(?![\d\/])/i) ||
    t.match(/\b\d{1,2}(?::\d\d)?\s*(?:am|pm)\b/i) || t.match(/\b(?:morning|afternoon|anytime|any time|all day)\b/i);
  return { date, time: tm ? tm[0].trim().replace(/\s+/g, ' ') : '' };
}

  const box = $('#admin-body');
  box.innerHTML = '<div id="exp-rc"><div class="empty"><span class="spin"></span></div></div><div id="exp-mi"></div>';
  try {
    const [rc, mi] = await Promise.all([api('receipts', { pending: true, tech: 'ALL' }), api('mileagelist', { offset: expOffset, tech: 'ALL' })]);
    $('#exp-rc').innerHTML = '<div class="group">🧾 Receipts to review · ' + rc.receipts.length + '</div>' + (rc.receipts.length ? rc.receipts.map(r => receiptCard(r, true)).join('') : '<div class="empty">Nothing waiting</div>');
    $('#exp-mi').innerHTML = '<div class="row between" style="margin:12px 4px 6px"><button class="act" onclick="expOffset++;renderExpenses()">‹</button><b>🚗 Miles · ' + esc(mi.period.label) + ' · ' + mi.total + ' mi</b>' +
        '<button class="act" onclick="expOffset=Math.max(0,expOffset-1);renderExpenses()"' + (expOffset ? '' : ' disabled') + '>›</button></div>' +
      (mi.techs.length ? '<div class="card" style="padding:8px"><table style="width:100%;font-size:13px;border-collapse:collapse">' + mi.techs.map(t =>
        '<tr style="border-top:1px solid var(--line)"><td style="padding:5px"><b>' + esc(t.name) + '</b> <span class="small">' + esc(t.tech) + '</span></td><td style="text-align:right">' + t.days + ' day' + (t.days === 1 ? '' : 's') + '</td><td style="text-align:right;padding:5px"><b>' + t.miles + ' mi</b></td></tr>').join('') + '</table></div>'
        : '<div class="empty">No miles logged</div>') +
      '<div class="small" style="margin:6px 4px;color:var(--sub)">Pick a tech at the top, then Pay → Miles / Receipts for their details (for admins, use their login or the Mileage / Receipts tabs in the sheet).</div>';
  } catch (e) { box.innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }
}
async function rcStatus(id, status, btn) {
  btn.disabled = true;
  try { await api('receiptstatus', { id, status }); toast('Marked ' + status); renderExpenses(); } catch (e) { toast(e.message, 4000); btn.disabled = false; }
}

// ── Trainer takes a ticket for training (the tech keeps it) ──
async function coTrain(cni, on) {
  const j = jobs.find(x => x.cni === cni) || {};
  const who = techName(j.tech) || j.tech || 'the tech';
  if (!(await sure(on ? '🎓 Take CNI ' + esc(cni) + ' for training?<div class="small" style="font-weight:400;margin-top:4px">' + esc(who) + ' keeps the ticket; it shows in your list too and you can work it. Training pay instead of the ticket rate: ' + esc(who) + ' $40, you $15.</div>'
                      : 'Stop training on CNI ' + esc(cni) + '? It stays with ' + esc(who) + '.', on ? 'Take for training' : 'Stop'))) return;
  try {
    await api('cotrain', { cni, on });
    flash(on ? 'Taken for training' : 'Training stopped', on ? who + ' keeps the ticket · $40 / $15 training pay' : 'back to the normal ticket rate', '🎓');
    j.cotrain = on ? { tech: session.user.tech, name: session.user.name } : null;
    render(); refresh();
  } catch (e) { toast(e.message, 5000); }
}

// ── Trainees ──────────────────────────────────────────────────────────────
async function setShadow(cni, on) {
  let name = 'Trainee';
  if (on) { name = await ask('👥 Add a trainee to CNI ' + esc(cni) + '<div class="small" style="font-weight:400;margin-top:4px">They\'ll see this ticket in the trainee login and shadow the tech. Training pay: trainee $40, trainer $15 instead of the ticket rate.</div>',
      { placeholder: 'Trainee\'s name', value: store.get('rw_last_trainee', ''), required: 'Enter the trainee\'s name', ok: 'Add trainee' });
    if (name === null) return; name = name.trim(); store.set('rw_last_trainee', name); }
  else if (!(await sure('Remove the trainee from CNI ' + esc(cni) + '?', 'Remove'))) return;
  try {
    const r = await api('shadow', { cni, on, name });
    flash(on ? 'Trainee added' : 'Trainee removed', on ? name + ' shadows ' + r.tech : '', '👥');
    const j = jobs.find(x => x.cni === cni); if (j) j.shadow = on ? { name } : null;
    render(); refresh();
  } catch (e) { toast(e.message, 5000); }
}

// ── Metros: our rollout scorecard + market share (all partners, Fieldcode Analytics, daily) ─────
let mtOpen = {};
async function renderMetros() {
  const box = $('#admin-body');
  box.innerHTML = '<div class="empty"><span class="spin"></span></div>';
  let d;
  try { d = await api('metros'); } catch (e) { box.innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; return; }
  const f = v => v == null ? '–' : v;
  const share = (m, list) => { const all = list.find(x => x.metro === m && x.partner === 'ALL'); if (!all) return null;
    const avail = (list.find(x => x.metro === m && x.partner === 'Available (no partner)') || {}).created30 || 0, us = (list.find(x => x.metro === m && x.partner === 'Nordkapp') || {}).created30 || 0;
    return all.created30 - avail > 0 ? Math.round(us / (all.created30 - avail) * 100) : null; };
  const metros = [...new Set(d.market.map(x => x.metro).concat(d.ours30.map(x => x.metro)))].filter(m => m && m !== 'Other');
  box.innerHTML = '<div class="small" style="margin:0 4px 8px">' + (d.date ? 'Market data ' + esc(nice(d.date)) + (d.prevDate ? ' · trend vs ' + esc(nice(d.prevDate)) : '') : '<span style="color:var(--amber)">No market data yet — leave a Fieldcode tab on Analytics View → Tickets overview with the Market Share script installed.</span>') + '</div>' +
    metros.map(m => {
      const o7 = d.ours7.find(x => x.metro === m) || {}, o30 = d.ours30.find(x => x.metro === m) || {};
      const us = d.market.find(x => x.metro === m && x.partner === 'Nordkapp') || {}, all = d.market.find(x => x.metro === m && x.partner === 'ALL') || {};
      const rivals = d.market.filter(x => x.metro === m && !/^(ALL|Nordkapp|Available|Hemmersbach)/.test(x.partner)).sort((a, b) => b.created30 - a.created30);
      const sh = share(m, d.market), shp = share(m, d.prev);
      const faster = us.medDays30 != null && rivals[0] && rivals[0].medDays30 != null ? us.medDays30 <= rivals[0].medDays30 : null;
      return '<div class="card"><div class="row between"><span class="co">' + esc(m) + '</span><b>' + (sh == null ? '' : sh + '% share') +
          (sh != null && shp != null ? ' <span class="small" style="color:var(--' + (sh >= shp ? 'green' : 'red') + ')">' + (sh >= shp ? '▲' : '▼') + Math.abs(sh - shp) + '</span>' : '') + '</b></div>' +
        '<dl class="kv" style="margin-top:6px">' +
          '<dt>Routed / closed (7d)</dt><dd>' + f(o7.routed) + ' / ' + f(o7.closed) + ' <span class="small">· 30d ' + f(o30.routed) + ' / ' + f(o30.closed) + '</span></dd>' +
          '<dt>Median days to visit</dt><dd><b>' + f(us.medDays30) + '</b>' + (rivals[0] ? ' <span class="small">vs ' + esc(rivals[0].partner) + ' ' + f(rivals[0].medDays30) + '</span>' : '') +
            (faster == null ? '' : faster ? ' <span class="chip green">faster</span>' : ' <span class="chip amber">slower</span>') + '</dd>' +
          '<dt>Visited ≤ 3 days</dt><dd>' + f(us.in3d30) + '%' + (rivals[0] ? ' <span class="small">vs ' + f(rivals[0].in3d30) + '%</span>' : '') + '</dd>' +
          '<dt>Original LSDT met</dt><dd>' + (o30.onTime == null ? '–' : o30.onTime + '%') + ' <span class="small">(' + f(o30.onTimeN) + ' tickets, 30d)</span></dd>' +
          '<dt>Fixed on 1st visit</dt><dd>' + (o30.fixRate == null ? '–' : o30.fixRate + '%') + '</dd>' +
          '<dt>Open now / available</dt><dd>' + f(us.openNow) + ' ours · ' + f((d.market.find(x => x.metro === m && x.partner === 'Available (no partner)') || {}).openNow) + ' in the pool</dd></dl>' +
        '<a href="#" class="small" onclick="event.preventDefault();mtOpen[\'' + esc(m) + '\']=!mtOpen[\'' + esc(m) + '\'];renderMetrosCached()">' + (mtOpen[m] ? '▾' : '▸') + ' All partners (30 days)</a>' +
        (mtOpen[m] ? '<div style="overflow-x:auto"><table style="width:100%;font-size:12px;border-collapse:collapse;margin-top:6px"><tr style="color:var(--sub)"><td>Partner</td><td style="text-align:right">Got</td><td style="text-align:right">Closed</td><td style="text-align:right">Days</td><td style="text-align:right">≤3d</td></tr>' +
          d.market.filter(x => x.metro === m && x.partner !== 'ALL').sort((a, b) => b.created30 - a.created30).map(x => '<tr style="border-top:1px solid var(--line)' + (x.partner === 'Nordkapp' ? ';font-weight:700' : '') + '"><td style="padding:3px 0">' + esc(x.partner) + '</td><td style="text-align:right">' + f(x.created30) +
            '</td><td style="text-align:right">' + f(x.closed30) + '</td><td style="text-align:right">' + f(x.medDays30) + '</td><td style="text-align:right">' + (x.in3d30 == null ? '–' : x.in3d30 + '%') + '</td></tr>').join('') +
          '<tr style="border-top:1px solid var(--line);color:var(--sub)"><td>All</td><td style="text-align:right">' + f(all.created30) + '</td><td style="text-align:right">' + f(all.closed30) + '</td><td style="text-align:right">' + f(all.medDays30) + '</td><td></td></tr></table></div>' : '') + '</div>';
    }).join('') +
    '<button class="act" style="width:100%;margin:6px 0" onclick="weeklyNow(this)">✉ Send the weekly update now</button>' +
    '<div class="small" style="margin:6px 4px;color:var(--sub)">Share = our tickets ÷ tickets assigned to anyone in the metro (30 days, HP + Lenovo). Days to visit = created → the tech\'s visit report, for every partner the same way. ' +
      'Original LSDT = the first LSDT our feed saw; Fieldcode moves the current one when an appointment is set, so that one isn\'t a fair comparison. The weekly update goes out Mondays 8 AM CT (email + Admin Team).</div>';
  renderMetros.last = d;
}
function renderMetrosCached() { renderMetros(); }
async function weeklyNow(b) {
  if (!(await sure('Send the weekly metro update now?<div class="small" style="font-weight:400;margin-top:4px">Email to the admins and a post in Admin Team.</div>', 'Send'))) return;
  b.disabled = true; try { await api('weeklynow'); flash('Weekly update sent', 'Email + Admin Team', '📊'); } catch (e) { toast(e.message, 5000); b.disabled = false; }
}

// ── Boot ──────────────────────────────────────────────────────────────────
window.addEventListener('online', () => refresh());
document.addEventListener('visibilitychange', () => { if (!document.hidden && lastAt && Date.now() - Date.parse(lastAt) > 60e3) refresh(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (session && session.user) start();
</script>
